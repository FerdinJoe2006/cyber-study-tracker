  if (!(amount > 0) || !(goal > 0)) return toast('Enter coins and a task goal above zero.', 'error');
  if (amount > totals().coins) return toast('You do not have that many coins.', 'error');
  if (S.stakes[weekKey]) return toast('This week already has a stake.', 'error');
  const st = { weekKey, amount, goal, status: 'active', ts: nowMs() };
  S.stakes[weekKey] = st; save('stakes', st);
  award('stake:' + weekKey, { date: today(), kind: 'stake', label: `Stake locked: ${goal} tasks`, xp: 0, coins: -amount });
  toast(`Locked ${amount} coins. Hit ${goal} tasks this week to win ${amount + Math.floor(amount * CONFIG.stakeBonusPct / 100)} back.`, 'good');
  refresh([]);
}
function settleStakes() {
  for (const st of Object.values(S.stakes)) {
    if (st.status !== 'active') continue;
    const end = addDays(st.weekKey, 6), done = tasksDoneIn(st.weekKey, end);
    if (done >= st.goal) {
      const back = st.amount + Math.floor(st.amount * CONFIG.stakeBonusPct / 100);
      award('stakewin:' + st.weekKey, { date: today(), kind: 'stake', label: 'Stake won', xp: 0, coins: back });
      st.status = 'won'; save('stakes', st);
      S.celebrate = { title: 'Stake won', body: `+${back} coins back` };
    } else if (today() > end) {
      award('stakelost:' + st.weekKey, { date: end, kind: 'stake-lost', label: 'Stake not reached', xp: 0, coins: 0, meta: { amount: st.amount } });
      st.status = 'lost'; save('stakes', st);
    }
  }
}
/* weekly recap for any week start date */
function recap(weekStart) {
  const end = addDays(weekStart, 6);
  let xp = 0, gained = 0, lost = 0, minutes = 0, tasks = 0, planned = 0, best = null, quizN = 0, ci = 0, missed = 0, focusSum = 0, focusN = 0;
  for (const e of Object.values(S.ledger)) {
    if (e.date < weekStart || e.date > end) continue;
    xp += e.xp || 0;
    if (e.kind === 'penalty') lost += -(e.coins || 0);
    else if (e.kind === 'stake-lost') lost += (e.meta && e.meta.amount) || 0;
    else if (e.coins > 0 && e.kind !== 'adjust') gained += e.coins;
  }
  for (let d = weekStart; d <= end; d = addDays(d, 1)) {
    const m = minutesOn(d); minutes += m; if (!best || m > best.m) best = { d, m };
    if (planFor(d) && dayKind(d) !== 'rest') planned++;
    if (planFor(d) && rec(d).status === 'done') tasks++;
    if (dayKind(d) === 'required' && d < today() && statusOf(d) === 'missed') missed++;
    quizN += S.reviews.filter((r) => r.date === d).length;
    if (S.checkins[d]) { ci++; focusSum += S.checkins[d].focus || 0; focusN++; }
  }
  const perfect = chestWeeks().some((c) => c.lastDate >= weekStart && c.lastDate <= end);
  const win = perfect ? 'A perfect week: every weekday task and the Saturday lab are done.'
    : tasks > 0 ? `You finished ${tasks} task${tasks > 1 ? 's' : ''} and studied ${fmtMin(minutes)}.`
    : minutes > 0 ? `You still put in ${fmtMin(minutes)} of study.` : 'A fresh week is ready when you are.';
  const improve = missed > 0 ? 'Pick one small block early in the week so a busy day does not stack up.'
    : quizN === 0 ? 'Try five flash cards a day to lock in what you studied.'
    : ci === 0 ? 'Try the daily check-in. It takes a minute and helps planning.'
    : 'Keep the same rhythm. Small steady days beat big rare ones.';
  const s = S.derived;
  return { weekStart, end, xp, gained, lost, minutes, tasks, planned, quizN, ci, focus: focusN ? focusSum / focusN : 0, win, improve, streak: s.streak, shields: s.shields, best };
}

function unlockBadge(id) {

function checkBadges() {
  const doneDays = Object.values(S.days).filter((r) => r.status === 'done' && planFor(r.date));

  if (doneDays.some((r) => isLabLike(planFor(r.date).type))) unlockBadge('first-lab');

  if (L >= 7) unlockBadge('streak-7'); if (L >= 30) unlockBadge('streak-30'); if (L >= 100) unlockBadge('streak-100');
  for (const p of S.projects) if (p.status === 'published') unlockBadge('project-' + p.num);
  for (const c of S.certs) if (c.status === 'passed') unlockBadge('cert-' + c.id);

  const hrs = S.sessions.filter((s) => s.kind === 'timer' && s.startHour !== undefined).map((s) => s.startHour);
  if (hrs.some((h) => h >= CONFIG.nightOwl.from || h < CONFIG.nightOwl.to)) unlockBadge('night-owl');
  if (hrs.some((h) => h >= CONFIG.earlyBird.from && h < CONFIG.earlyBird.to)) unlockBadge('early-bird');
  if (S.reviews.length >= CONFIG.quizBadgeTarget) unlockBadge('quiz-1000');

function checkLevelAndPhases() {

  /* a phase is "finished" once its last roadmap day is behind us and you finished at least one task in it */
  const cel = [...(S.kv.phasesCelebrated || [])], t = today();
  let changed = false;
  for (const p of S.phases) {
    if (cel.includes(p.num)) continue;
    const lastDay = Math.max(...S.plan.filter((x) => x.phase === p.num).map((x) => x.day));
    const lastDate = dateForDay(lastDay);
    if (!lastDate || t <= lastDate) continue;
    const any = Object.values(S.days).some((r) => r.status === 'done' && (planFor(r.date) || {}).phase === p.num);
    if (any) S.celebrate = S.celebrate || { title: 'Phase finished', body: `Phase ${p.num}: ${p.name}` };

}
/* projects / certs write-through with their XP awards */
/* "Published" is locked: it only unlocks with the code given after the project is reviewed. */
async function unlockProject(num, code) {
  const p = S.projects.find((x) => x.num === num); if (!p || p.status === 'published') return false;
  const bytes = new TextEncoder().encode(`cyber-project-v1:${num}:${String(code).trim().toUpperCase()}`);
  const hex = Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256', bytes)), (b) => b.toString(16).padStart(2, '0')).join('');
  if (hex !== (window.PROJECT_HASHES || {})[num]) return false;
  setProject(num, { status: 'published' }, true); return true;
}
function setProject(num, patch, unlocked) {
  const p = S.projects.find((x) => x.num === num);
  if (p.status === 'published' && !unlocked) return;                       // verified projects are locked
  if (patch.status === 'published' && !unlocked) return;                   // cannot publish without a code
  Object.assign(p, patch); save('projects', p);
  if (p.status === 'published') award('project:' + num, { date: today(), kind: 'project', label: `Project ${num} published`, xp: CONFIG.xp.projectPublished }); else revoke('project:' + num);

}

/* ---------------------------------------------------------------------
   14. Pace, behind-schedule meter, catch-up
   --------------------------------------------------------------------- */
/* roadmap days that should be finished before today but are not (and are not yet caught up) */
function backlog() {
  const out = [], t = today();
  if (!S.settings.planStart) return out;
  for (let d = S.settings.planStart; d < t; d = addDays(d, 1)) {
    const p = planFor(d); if (!p || dayKind(d) === 'rest') continue;
    const st = statusOf(d);
    if ((st === 'missed' || st === 'todo' || st === 'doing') && !rec(d).caught && dayKind(d) === 'required') out.push({ date: d, plan: p });
  }
  return out;
}
/* optional tasks suggested for dropping: Sunday review days (backlog first, then the next two weeks) */
function dropSuggestions() {
  const t = today(), out = [];
  for (let d = addDays(t, -21); d < addDays(t, 14) && out.length < 5; d = addDays(d, 1)) {
    const p = planFor(d); if (p && p.type === 'review' && rec(d).status !== 'done' && !rec(d).caught && d >= S.settings.planStart) out.push({ date: d, plan: p });
  }
  return out;
}
/* shift the rest of the plan forward by the number of unfinished days */
function catchUp(dropReviews) {
  const t = today();
  let list = backlog();
  const reviewDrops = dropReviews ? dropSuggestions().filter((x) => x.date >= t) : [];
  if (!list.length) return toast('Nothing to catch up. You are on pace.', 'good');
  const shifts = [...(S.kv.shifts || []), { from: t, by: list.length }];
  setKv('shifts', shifts);
  for (const b of list) { const r = { ...rec(b.date), date: b.date, caught: true }; S.days[b.date] = r; save('days', r); }
  for (const x of reviewDrops) { const r = { ...rec(x.date), date: x.date, status: 'skipped', caught: true }; S.days[x.date] = r; save('days', r); }
  toast(`Plan shifted forward by ${list.length} day${list.length > 1 ? 's' : ''}. Today now shows the first unfinished task.`, 'good');
  refresh([]);
}
const hoursKey = (type) => (isLabLike(type) ? 'lab' : type === 'review' ? 'review' : 'study');
function plannedHoursOn(date) { const p = planFor(date); return p ? CONFIG.plannedHours[hoursKey(p.type)] : 0; }
/* cumulative arrays for the chart: planned vs actual hours, one point per day from plan start to plan end */
function paceSeries() {
  const start = S.settings.planStart, n = S.plan.length, t = today();
  if (!start) return { planned: [], actual: [], start: '' };
  const planned = [], actual = []; let p = 0, a = 0;
  const byDate = {}; for (const s of S.sessions) byDate[s.date] = (byDate[s.date] || 0) + s.minutes;
  for (let i = 0; i < n; i++) {
    const d = addDays(start, i);
    p += dayKind(d) === 'rest' ? 0 : plannedHoursOn(d); a += (byDate[d] || 0) / 60;
    planned.push(p); actual.push(d <= t ? a : null);
  }
  return { planned, actual, start };
}

/* ---------------------------------------------------------------------
   15. Reminders (Notifications API + in-app banners)
   --------------------------------------------------------------------- */
function reminderCandidates() {
  const t = today(), out = [], T = S.settings.times, p = planFor(t), k = dayKind(t);
  const st = statusOf(t);
  if (p && k !== 'rest') {
    /* lab, review and study days each get their own reminder time */
    if (isLabLike(p.type)) out.push({ id: 'lab:' + t, at: T.lab, title: 'Lab day', body: p.task, tab: 'today' });
    else if (p.type === 'review') out.push({ id: 'review:' + t, at: T.review, title: 'Review day', body: p.task, tab: 'today' });
    else out.push({ id: 'study:' + t, at: T.study, title: 'Time to study', body: p.task, tab: 'today' });
    if (st === 'done') out.length = 0;   // the task reminder only matters while the task is open
    if (!S.checkins[t]) out.push({ id: 'checkin:' + t, at: T.checkin, title: 'Daily check-in', body: 'What did you finish? What blocked you? What is next?', tab: 'quiz' });
  }
  const due = dueCards().length;
  if (due) out.push({ id: 'sr:' + t, at: T.study, title: 'Flash cards due', body: `${due} card${due > 1 ? 's' : ''} ready for review.`, tab: 'quiz' });
  for (const c of S.certs) {
    if (c.status === 'passed') continue;
    const d = certDate(c); if (!d) continue;
    const left = diffDays(d, t);
    if ([14, 7, 3, 1].includes(left)) out.push({ id: `exam:${c.id}:${left}`, at: '09:00', title: `${c.name.split(' (')[0]} in ${left} day${left > 1 ? 's' : ''}`, body: `Exam target ${fmtDate(d)}.`, tab: 'certs' });
  }
  if (S.settings.weeklyBackup) {
    const lb = S.kv.lastBackup, ref = lb || S.kv.firstOpen || t;
    if (diffDays(t, ref) >= 7) out.push({ id: 'backup:' + t, at: T.study, title: 'Weekly backup', body: 'Export your data from Settings so it is safe.', tab: 'settings' });
  }
  return out;
}
function runReminders() {
  const now = new Date(), hm = `${pad(now.getHours())}:${pad(now.getMinutes())}`;
  const log = S.kv.remindLog || [];
  const fired = [];
  for (const r of reminderCandidates()) {
    if (r.at > hm || log.includes(r.id) || S.banners.some((b) => b.id === r.id)) continue;
    S.banners.push(r); fired.push(r);
    if (S.settings.notifications && 'Notification' in window && Notification.permission === 'granted') {
      try {
        if (navigator.serviceWorker && navigator.serviceWorker.ready) navigator.serviceWorker.ready.then((reg) => reg.showNotification(r.title, { body: r.body, icon: 'icons/icon-192.png', tag: r.id })).catch(() => new Notification(r.title, { body: r.body }));
        else new Notification(r.title, { body: r.body });
      } catch (e) { /* in-app banner is the fallback */ }
    }
  }
  if (fired.length) commit();
}
function dismissBanner(id) {
  S.banners = S.banners.filter((b) => b.id !== id);

const shuffle = (a) => { a = [...a]; for (let i = a.length - 1; i > 0; i--) { const j = (Math.random() * (i + 1)) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; };

/* START OVER: erases all progress (days, time, XP and coins, badges, quiz history, check-ins, practice tests,
   redemptions, stakes, timer, streak, plan start) and puts projects, certs and milestones back to "not started".

   After this the "Start your roadmap" screen appears so you can pick a new start date. */

/* ---------------------------------------------------------------------
   18. Boot
   --------------------------------------------------------------------- */
async function boot() {

    await DB.open(); await loadAll(); await seedIfNeeded(); await loadAll();
    applyTheme();
    if (navigator.storage && navigator.storage.persist) navigator.storage.persist().then((ok) => setKv('persisted', !!ok)).catch(() => {});
    S.ready = true; refresh([]); runReminders();
    if (isStarted()) registerBackgroundReminders();

/* tiny, safe markdown renderer: escapes HTML first, then headings, bold, italic, code, links, lists */
function mdToHtml(src) {
  const esc = (s) => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  const inline = (s) => esc(s).replace(/`([^`]+)`/g, '<code>$1</code>').replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>').replace(/(^|[^*])\*([^*]+)\*/g, '$1<em>$2</em>')
    .replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
  const out = []; let list = false, code = false;
  for (const line of src.split('\n')) {
    if (line.trim().startsWith('```')) { out.push(code ? '</pre>' : '<pre>'); code = !code; continue; }
    if (code) { out.push(esc(line) + '\n'); continue; }
    const li = line.match(/^\s*[-*] (.*)/);
    if (li) { if (!list) { out.push('<ul>'); list = true; } out.push('<li>' + inline(li[1]) + '</li>'); continue; }
    if (list) { out.push('</ul>'); list = false; }
    const h = line.match(/^(#{1,3}) (.*)/);
    if (h) out.push('<h4>' + inline(h[2]) + '</h4>'); else if (line.trim()) out.push('<p>' + inline(line) + '</p>');
  }
  if (list) out.push('</ul>'); if (code) out.push('</pre>');
  return out.join('');
}
function Markdown({ text }) { return html`<div className="md" dangerouslySetInnerHTML=${{ __html: mdToHtml(text || '') }}></div>`; }

function MonthView({ focus, setFocus, sel, setSel }) {

  const rest = (S.kv.restDays || []).filter((d) => d.slice(0, 7) === first.slice(0, 7)).length;
  const prev = ymd(new Date(d0.getFullYear(), d0.getMonth() - 1, 1, 12)), next = ymd(new Date(d0.getFullYear(), d0.getMonth() + 1, 1, 12));
  return html`<div className="col"><div className="row between wrap"><div className="row"><button className="btn sm icon" aria-label="Previous month" onClick=${() => setFocus(prev)}><${Icon} n="left" /></button><strong>${MONTHS[d0.getMonth()]} ${d0.getFullYear()}</strong><button className="btn sm icon" aria-label="Next month" onClick=${() => setFocus(next)}><${Icon} n="right" /></button></div>

function AllView({ q, setQ, ft, setFt, fs, setFs, fp, setFp, sel, setSel }) {

/* an input that keeps its own draft and saves on blur (used for long forms) */
function DraftField({ label, value, onSave, type, multiline, placeholder, min, max }) {
  const [v, setV] = useState(value ?? '');
  useEffect(() => setV(value ?? ''), [value]);
  const commit = () => { if (String(v) !== String(value ?? '')) onSave(v); };
  return html`<label className="f">${label}${multiline
    ? html`<textarea value=${v} placeholder=${placeholder} style=${{ minHeight: 64 }} onInput=${(e) => setV(e.target.value)} onBlur=${commit}></textarea>`
    : html`<input type=${type || 'text'} value=${v} min=${min} max=${max} placeholder=${placeholder} onInput=${(e) => setV(e.target.value)} onBlur=${commit} />`}</label>`;
}

function StudyView() {
  const reduced = useReducedMotion();
  const [run, setRun] = useState(null);   // {queue, flipped, total, correct, retry:Set}
  const hist = S.quizSessions.slice(-8).reverse();
  /* each card is a multiple-choice question (the right answer plus three other cards' answers), so XP is only paid for answers you really know. Decks too small for that fall back to self-grading. */
  const withOpts = (r) => { const c = r.queue.length ? S.cards.find((x) => x.id === r.queue[0]) : null; return { ...r, picked: null, opts: c ? mcqOptions(c) : null }; };
  const start = () => { const ids = shuffle(dueCards()).slice(0, 30).map((c) => c.id); if (ids.length) setRun(withOpts({ queue: ids, flipped: false, total: 0, correct: 0, retry: [] })); };
  const card = run && run.queue.length ? S.cards.find((c) => c.id === run.queue[0]) : null;
  const answer = (ok) => {
    const id = run.queue[0], first = !run.retry.includes(id);
    answerCard(card, ok, first);
    let queue = run.queue.slice(1), retry = run.retry;
    if (!ok) { queue = [...queue.slice(0, 3), id, ...queue.slice(3)]; retry = [...retry, id]; }   // wrong answers come back sooner
    const next = { queue, flipped: false, retry, total: run.total + (first ? 1 : 0), correct: run.correct + (first && ok ? 1 : 0) };
    if (!queue.length) { finishQuizSession(next.total, next.correct); setRun({ ...next, done: true }); } else setRun(withOpts(next));
  };
  useEffect(() => {
    if (!run || run.done) return;
    const f = (e) => { if (S.verifyReq || /input|textarea|select/i.test(e.target.tagName)) return;
      if (run.opts) {
        if (run.picked === null && /^[1-4]$/.test(e.key) && run.opts[Number(e.key) - 1]) setRun((r) => ({ ...r, picked: Number(e.key) - 1 }));
        else if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); if (run.picked === null) setRun((r) => ({ ...r, picked: -1 })); else answer(run.picked >= 0 && run.opts[run.picked].ok); }
        return;
      }
      if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); setRun((r) => ({ ...r, flipped: true })); }
      if (run.flipped && e.key === '1') answer(false); if (run.flipped && e.key === '2') answer(true); };
    addEventListener('keydown', f); return () => removeEventListener('keydown', f);
  });
  return html`<div className="grid2"><div className="col gap-16">
    ${!run && html`<${Tile} title="Self-test"><div className="col"><p className="taskline">${dueCards().length ? `${dueCards().length} card${dueCards().length > 1 ? 's are' : ' is'} ready.` : 'No cards due right now.'}</p>
      <p className="small muted">Pick the right answer from four choices. Right answers move up a Leitner box and return later (1, 2, 4, 8, 16 days). Wrong answers drop to box 1 and come back in this session. Each correct card earns ${CONFIG.xp.quizCorrect} XP, plus ${CONFIG.xp.quizWrongBonus} if you missed it on an earlier day.</p>
      ${S.settings.introduceByWeek && html`<p className="xs muted">Cards unlock as their roadmap week arrives (turn this off in Settings).</p>`}
      <button className="btn primary xl" style=${{ alignSelf: 'flex-start' }} disabled=${!dueCards().length} onClick=${start}><${Icon} n="play" />Start session</button></div></${Tile}>`}
    ${run && run.done && html`<${Tile} title="Session complete"><div className="col"><div className="big">${run.correct}/${run.total}</div><p className="muted">${run.total ? Math.round((run.correct / run.total) * 100) : 0}% right on the first try. Cards you missed are scheduled for tomorrow.</p><button className="btn primary" onClick=${() => setRun(null)}>Done</button></div></${Tile}>`}
    ${run && card && !run.done && html`<${Tile} title=${`Card ${run.total + 1} · ${run.queue.length} left`} action=${html`<span className="chip">${card.topic} · box ${card.box}</span>`}>
      <div className=${'flip' + (run.flipped ? ' on' : '') + (reduced ? ' nomo' : '')}><div className="flip-in">
        <div className="face front" aria-hidden=${run.flipped}><span className="xs muted">Question</span>${card.front}</div>
        <div className="face back" aria-hidden=${!run.flipped}><span className="xs muted">Answer</span>${card.back}</div></div></div>
      ${run.opts ? html`<div className="col gap-6" style=${{ marginTop: 14 }}>
        ${run.opts.map((o, i) => html`<button type="button" key=${i} className=${'opt' + (run.picked !== null ? (o.ok ? ' right' : run.picked === i ? ' wrong' : '') : '')} disabled=${run.picked !== null} onClick=${() => setRun({ ...run, picked: i })}><span className="kbd">${i + 1}</span> ${o.text}</button>`)}
        ${run.picked === null ? html`<button type="button" className="btn sm ghost" style=${{ alignSelf: 'flex-start' }} onClick=${() => setRun({ ...run, picked: -1 })}>I don't know <span className="kbd">Space</span></button>`
          : html`<div className="row between wrap"><span className=${'chip ' + (run.picked >= 0 && run.opts[run.picked].ok ? 'good' : 'lilac')}>${run.picked >= 0 && run.opts[run.picked].ok ? 'Correct' : 'Not quite. The right answer is highlighted.'}</span><button type="button" className="btn primary xl" autoFocus onClick=${() => answer(run.picked >= 0 && run.opts[run.picked].ok)}>Next <span className="kbd">Space</span></button></div>`}</div>` : null}
      ${!run.opts && html`<div className="row between wrap" style=${{ marginTop: 14 }}>
        ${!run.flipped ? html`<button className="btn primary xl grow" onClick=${() => setRun({ ...run, flipped: true })}>Show answer <span className="kbd">Space</span></button>`
          : html`<button className="btn xl grow" onClick=${() => answer(false)}>Missed it <span className="kbd">1</span></button><button className="btn primary xl grow" onClick=${() => answer(true)}>Got it <span className="kbd">2</span></button>`}</div>`}
      <div style=${{ marginTop: 12 }}><button className="btn sm ghost" onClick=${() => { if (run.total) finishQuizSession(run.total, run.correct); setRun(null); }}>End session</button></div></${Tile}>`}
  </div>
  <${Tile} title="Score history">${hist.length ? html`<div className="col"><div className="strip" style=${{ minHeight: 70, alignItems: 'flex-end' }}>${hist.slice().reverse().map((h) => html`<div key=${h.id} title=${`${h.correct}/${h.total}`} style=${{ flex: 1, height: Math.max(8, (h.correct / h.total) * 100) + '%', background: 'var(--accent2)', borderRadius: 4 }}></div>`)}</div>
    <table className="t"><thead><tr><th>Date</th><th>Score</th><th>Cards</th></tr></thead><tbody>${hist.map((h) => html`<tr key=${h.id}><td>${fmtDate(h.date)}</td><td className="num">${Math.round((h.correct / h.total) * 100)}%</td><td className="num">${h.correct}/${h.total}</td></tr>`)}</tbody></table>
    <p className="xs muted">${S.reviews.length} cards answered in total (badge at ${CONFIG.quizBadgeTarget}).</p></div>` : html`<${Empty}>Your session scores will appear here.<//>`}</${Tile}></div>`;
}

const EASE = 'cubic-bezier(0.22, 1, 0.36, 1)';
const ACC = 'var(--accent)', ACC2 = 'var(--accent2)';
const smooth = (pts) => pts.map(([x, y], i) => {
  if (i === 0) return `M ${x.toFixed(1)} ${y.toFixed(1)}`;
  const [px, py] = pts[i - 1], m = (px + x) / 2;
  return `C ${m.toFixed(1)} ${py.toFixed(1)}, ${m.toFixed(1)} ${y.toFixed(1)}, ${x.toFixed(1)} ${y.toFixed(1)}`;
}).join(' ');

/* ---------- hero: greeting, level, XP bar, overall %, 30-day study strip ---------- */

    <div className="col" style=${{ marginTop: 14, gap: 8 }}>
      ${ready && html`<div className="row between"><span className="small"><span className="chip good">Ready</span> ${ready.name}</span><button className="btn sm primary" onClick=${() => goTab('rewards')}>Redeem</button></div>`}
      ${nextR ? html`<div><div className="row between small"><span>Next: ${nextR.name}</span><span className="num muted">${nextR.cost - coins} to go</span></div><div className="bar lilac" style=${{ marginTop: 6 }}><i style=${{ width: Math.min(100, (coins / nextR.cost) * 100) + '%' }}></i></div></div>` : !ready && html`<p className="small muted">Add a reward in the shop to save toward.</p>`}</div></${Tile}>`;
}

/* ---------- projects + exams ---------- */
function ProjTile() {
  const done = S.projects.filter((p) => p.status === 'published').length;
  return html`<${Tile} className="b-proj" title="Projects" action=${html`<button className="btn sm ghost" onClick=${() => goTab('certs')}>Open</button>`}>
    <p className="big">${done}<span className="muted" style=${{ fontSize: 20 }}> / 12</span></p>
    <div style=${{ display: 'grid', gridTemplateColumns: 'repeat(6,1fr)', gap: 6, marginTop: 16 }}>${S.projects.map((p) => html`<span key=${p.num} title=${`Project ${p.num}: ${p.name}`} style=${{ aspectRatio: '1', borderRadius: 8, display: 'grid', placeItems: 'center', fontSize: 11, fontFamily: 'var(--mono)', fontWeight: 600, background: p.status === 'published' ? ACC : p.status === 'in-progress' ? 'color-mix(in oklch, var(--accent2) 45%, var(--muted))' : 'var(--muted)', color: p.status === 'published' ? 'var(--accent-ink)' : 'var(--muted-foreground)' }}>${p.num}</span>`)}</div></${Tile}>`;
}
function ExamsTile() {
  const t = today(), list = S.certs.filter((c) => c.status !== 'passed').map((c) => ({ c, d: certDate(c) })).filter((x) => x.d).sort((a, b) => (a.d < b.d ? -1 : 1)).slice(0, 4);
  return html`<${Tile} className="b-exams span2" title="Upcoming exams">${list.length ? html`<ul className="feed">${list.map(({ c, d }) => { const left = diffDays(d, t); return html`<li key=${c.id}><span className="ic"><${Icon} n="certs" /></span><div style=${{ minWidth: 0, flex: 1 }}><p style=${{ fontSize: 13, fontWeight: 520, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>${c.name}</p><p className="xs muted">${fmtDate(d)} · ${c.status}</p></div><span className=${'chip ' + (left >= 0 && left <= 14 ? 'amber' : '')}><span className="num">${left >= 0 ? left + ' days' : Math.abs(left) + ' d ago'}</span></span></li>`; })}</ul>` : html`<${Empty}>No upcoming exams. Nicely done.<//>`}</${Tile}>`;
}
function FeedTile() {
  const items = feedItems(5), mounted = useMounted();
  return html`<${Tile} className="b-feed span2" title="Recent activity">${items.length ? html`<ul className="feed">${items.map((a, i) => html`<li key=${a.ts + a.title} style=${{ opacity: mounted ? 1 : 0, transform: mounted ? 'none' : 'translateY(6px)', transition: `opacity 500ms ease ${300 + i * 70}ms, transform 500ms ${EASE} ${300 + i * 70}ms` }}>
    <span className="ic"><${Icon} n=${a.icon} /></span><div style=${{ minWidth: 0, flex: 1 }}><p style=${{ fontSize: 13, fontWeight: 520, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>${a.title}</p><p className="xs muted">${a.detail}</p></div><span className="num" style=${{ fontSize: 12, textAlign: 'right' }}>${a.amount}</span></li>`)}</ul>` : html`<${Empty}>Study sessions, XP, badges and quiz results show up here.<//>`}</${Tile}>`;
}

function DashboardPage() {
  useApp(); const reduced = useReducedMotion();
  if (!isStarted()) return html`<${StartCard} />`;
  return html`<div className="page"><div className="page-head"><div><h1>Dashboard</h1><p className="muted">Your year at a glance.</p></div></div>
    <div className="bento"><${HeroTile} reduced=${reduced} /><${CardsTile} reduced=${reduced} /><${GaugeTile} reduced=${reduced} /><${ChartTile} reduced=${reduced} /><${AllocTile} /><${TodayTile} /><${WeekTile} /><${HeatTile} /><${CoinsTile} reduced=${reduced} /><${ProjTile} /><${FeedTile} /><${ExamsTile} /></div></div>`;
}

/* =====================================================================
   STUDY TRACKER - ui_app.js   App shell: tabs, shortcuts, mount
   ===================================================================== */
function App() {
  useApp(); const tab = useTab();
  /* desktop keyboard shortcuts: S start/stop timer, C complete today, N new note */
  useEffect(() => {
    const f = (e) => {
      if (S.verifyReq || e.ctrlKey || e.metaKey || e.altKey || /input|textarea|select/i.test(e.target.tagName) || e.target.isContentEditable) return;
      const k = e.key.toLowerCase();
      if (k === 's') { e.preventDefault(); timerState() ? timerStop(false) : timerStart(); }
      else if (k === 'c') { if (planFor(today())) { e.preventDefault(); completeDay(today()); } }
      else if (k === 'n') { e.preventDefault(); goTab('today'); setTimeout(() => { const a = document.getElementById('note-area'); if (a) a.focus(); }, 80); }
    };
    addEventListener('keydown', f); return () => removeEventListener('keydown', f);
  }, []);
  if (S.error) return html`<div className="tile fatal col"><h2>Storage is not available</h2><p className="muted">${S.error}</p><p className="small muted">This app saves everything in your browser's IndexedDB. Private browsing windows, blocked site data or a full disk can stop it. Try a normal window, allow site data for this page, then reload.</p><button className="btn primary" style=${{ alignSelf: 'flex-start' }} onClick=${() => location.reload()}>Reload</button></div>`;
  if (!S.ready) return html`<div className="fatal"><p className="muted">Loading your plan…</p></div>`;
  const page = { today: TodayPage, plan: PlanPage, quiz: QuizPage, dashboard: DashboardPage, rewards: RewardsPage, certs: CertsPage, settings: SettingsPage }[tab];
  const nav = (cls) => TABS.map(([k, label, short, icon]) => html`<button key=${k} className="tab" aria-current=${tab === k ? 'page' : undefined} onClick=${() => goTab(k)} aria-label=${label}><${Icon} n=${icon} /><span>${cls === 'side' ? label : short}</span></button>`);
  return html`<div className="app"><a href="#main" className="skip" onClick=${(e) => { e.preventDefault(); document.getElementById('main').focus(); }}>Skip to content</a>
    <nav className="side" aria-label="Main"><div className="brand"><img src="icons/icon-192.png" alt="" />Cyber Study</div>${nav('side')}
      <div className="keys"><div><span className="kbd">S</span> start / stop</div><div><span className="kbd">C</span> complete</div><div><span className="kbd">N</span> new note</div></div></nav>
    <main id="main" tabIndex="-1" className="main" style=${{ outline: 'none' }}><${page} /></main>
    <nav className="tabbar" aria-label="Main">${nav('bar')}</nav><${Toasts} /><${VerifyHost} /><${Celebration} /></div>`;
}
ReactDOM.createRoot(document.getElementById('root')).render(html`<${App} />`);
boot();

</script>
</body>
