:root {
  color-scheme: dark;
  --background: oklch(0.16 0.012 290);
  --foreground: oklch(0.96 0.008 85);
  --card: oklch(0.21 0.014 290);
  --card-2: oklch(0.245 0.015 290);
  --border: oklch(0.32 0.016 290);
  --muted: oklch(0.27 0.014 290);
  --muted-foreground: oklch(0.74 0.02 290);
  --accent: oklch(0.83 0.15 75);          /* amber */
  --accent-fg: oklch(0.83 0.15 75);       /* amber used as text */
  --accent-ink: oklch(0.24 0.06 70);      /* text on amber fills */
  --accent2: oklch(0.76 0.12 300);        /* lilac */
  --good: oklch(0.8 0.14 160);
  --ring: oklch(0.83 0.15 75);
  --shadow: 0 18px 40px -22px oklch(0 0 0 / 0.7);
  --ease: cubic-bezier(0.22, 1, 0.36, 1);
  --radius: 26px;
  --font: "Geist", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono: "Geist Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
:root[data-theme="light"] {
  color-scheme: light;
  --background: oklch(0.965 0.006 85);
  --foreground: oklch(0.22 0.02 290);
  --card: oklch(0.995 0.003 85);
  --card-2: oklch(0.96 0.006 85);
  --border: oklch(0.88 0.01 85);
  --muted: oklch(0.94 0.008 85);
  --muted-foreground: oklch(0.44 0.02 290);
  --accent: oklch(0.8 0.16 75);
  --accent-fg: oklch(0.5 0.13 62);
  --accent2: oklch(0.58 0.15 295);
  --good: oklch(0.5 0.12 160);
  --shadow: 0 14px 30px -20px oklch(0.3 0.03 290 / 0.35);
}

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--background); color: var(--foreground); font: 15px/1.5 var(--font); min-height: 100dvh; font-feature-settings: "ss01", "cv11"; -webkit-tap-highlight-color: transparent; }
::selection { background: color-mix(in oklch, var(--accent) 45%, transparent); color: var(--foreground); }
input, textarea, select, button { font: inherit; color: inherit; caret-color: var(--accent); }
button { cursor: pointer; touch-action: manipulation; }
:focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; border-radius: 8px; }
* { scrollbar-width: thin; scrollbar-color: color-mix(in oklch, var(--muted-foreground) 40%, transparent) transparent; }
h1, h2, h3, h4, p { margin: 0; }
h1 { font-size: 28px; line-height: 1.1; letter-spacing: -0.03em; font-weight: 620; text-wrap: balance; }
h2 { font-size: 19px; letter-spacing: -0.02em; font-weight: 600; text-wrap: balance; }
a { color: var(--accent-fg); text-underline-offset: 3px; }
.mono, .num { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted-foreground); }
.small { font-size: 13px; }
.xs { font-size: 12px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.skip { position: absolute; left: 8px; top: -60px; background: var(--accent); color: var(--accent-ink); padding: 8px 14px; border-radius: 10px; z-index: 100; font-weight: 600; }
.skip:focus { top: 8px; }

/* ---------- app shell: sidebar on desktop, bottom tab bar on mobile ---------- */
.app { display: grid; grid-template-columns: 1fr; min-height: 100dvh; }
.side { display: none; }
.main { padding: 16px 16px calc(92px + env(safe-area-inset-bottom)); max-width: 1160px; width: 100%; margin: 0 auto; min-width: 0; }
.tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; display: grid; grid-template-columns: repeat(7, 1fr); background: color-mix(in oklch, var(--card) 92%, transparent); border-top: 1px solid var(--border); padding: 6px 4px calc(6px + env(safe-area-inset-bottom)); backdrop-filter: blur(14px); }
.tab { display: flex; flex-direction: column; align-items: center; gap: 3px; min-height: 48px; padding: 6px 2px; border: 0; background: none; color: var(--muted-foreground); font-size: 10.5px; font-weight: 500; border-radius: 12px; position: relative; }
.tab svg { width: 21px; height: 21px; }
.tab[aria-current="page"] { color: var(--accent-fg); }
.tab[aria-current="page"]::after { content: ""; position: absolute; top: 2px; width: 18px; height: 3px; border-radius: 3px; background: var(--accent); }
.tab .full { display: none; }
@media (min-width: 900px) {
  .app { grid-template-columns: 236px 1fr; }
  .side { display: flex; flex-direction: column; gap: 4px; padding: 22px 14px; position: sticky; top: 0; height: 100dvh; border-right: 1px solid var(--border); }
  .side .brand { display: flex; align-items: center; gap: 10px; padding: 4px 10px 18px; font-weight: 620; letter-spacing: -0.02em; font-size: 16px; }
  .side .brand img { width: 30px; height: 30px; border-radius: 9px; }
  .main { padding: 28px 32px 48px; }
  .tabbar { display: none; }
  .side .tab { flex-direction: row; justify-content: flex-start; gap: 12px; font-size: 14px; padding: 10px 12px; min-height: 44px; }
  .side .tab[aria-current="page"] { background: var(--muted); color: var(--foreground); }
  .side .tab[aria-current="page"]::after { display: none; }
  .side .tab[aria-current="page"] svg { color: var(--accent-fg); }
  .side .keys { margin-top: auto; font-size: 12px; color: var(--muted-foreground); padding: 10px 12px; line-height: 1.9; }
}
@media (max-width: 899px) { .tab .full { display: none; } }
.kbd { font-family: var(--mono); font-size: 11px; border: 1px solid var(--border); border-radius: 6px; padding: 1px 6px; background: var(--muted); color: var(--foreground); }

/* ---------- layout helpers ---------- */
.row { display: flex; align-items: center; gap: 10px; }
.col { display: flex; flex-direction: column; gap: 10px; }
.wrap { flex-wrap: wrap; }
.between { justify-content: space-between; }
.grow { flex: 1; min-width: 0; }
.gap-6 { gap: 6px; } .gap-16 { gap: 16px; } .gap-24 { gap: 24px; }
.page { display: flex; flex-direction: column; gap: 14px; }
.page-head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 10px 20px; margin-bottom: 4px; }
.grid2 { display: grid; gap: 14px; grid-template-columns: 1fr; }
@media (min-width: 900px) { .grid2 { grid-template-columns: 1.25fr 1fr; align-items: start; } .grid2.even { grid-template-columns: 1fr 1fr; } }
.hr { height: 1px; background: var(--border); border: 0; margin: 6px 0; }

/* ---------- tile (the bento card) ---------- */
.tile { position: relative; display: flex; flex-direction: column; min-width: 0; overflow: hidden; border: 1px solid var(--border); background: var(--card); border-radius: var(--radius); padding: 20px; }
.tile.flat { border-radius: 20px; }
.tile > header, .tile-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
.tile h3 { font-size: 13px; font-weight: 520; color: var(--muted-foreground); }
.tile.accent { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
.tile.accent h3, .tile.accent .muted { color: color-mix(in oklch, var(--accent-ink) 72%, transparent); }
.big { font-family: var(--mono); font-size: 30px; font-weight: 600; letter-spacing: -0.04em; line-height: 1.05; font-variant-numeric: tabular-nums; }
.pillsbar { display: inline-flex; border: 1px solid var(--border); border-radius: 999px; padding: 2px; }
.pillsbar button { border: 0; background: none; border-radius: 999px; padding: 6px 11px; min-height: 30px; font-family: var(--mono); font-size: 11px; font-weight: 500; color: var(--muted-foreground); }
.pillsbar button[aria-checked="true"], .pillsbar button[aria-pressed="true"] { background: var(--foreground); color: var(--background); }
.chip { display: inline-flex; align-items: center; gap: 5px; border-radius: 999px; padding: 3px 10px; font-size: 12px; font-weight: 520; background: var(--muted); color: var(--muted-foreground); white-space: nowrap; }
.chip.amber { background: color-mix(in oklch, var(--accent) 20%, transparent); color: var(--accent-fg); }
.chip.lilac { background: color-mix(in oklch, var(--accent2) 22%, transparent); color: var(--accent2); }
.chip.good { background: color-mix(in oklch, var(--good) 20%, transparent); color: var(--good); }
:root[data-theme="light"] .chip.lilac { color: var(--accent2); }
.bar { height: 8px; border-radius: 99px; background: var(--muted); overflow: hidden; }
.bar > i { display: block; height: 100%; border-radius: 99px; background: var(--accent); transition: width 900ms var(--ease); }
.bar.lilac > i { background: var(--accent2); }
.tile.accent .bar { background: color-mix(in oklch, var(--accent-ink) 16%, transparent); }
.tile.accent .bar > i { background: var(--accent-ink); }

/* ---------- buttons / fields ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 0 18px; border-radius: 14px; border: 1px solid var(--border); background: var(--card-2); font-weight: 560; font-size: 14px; transition: transform 160ms var(--ease), background 160ms, border-color 160ms; white-space: nowrap; }
.btn:hover { border-color: color-mix(in oklch, var(--muted-foreground) 55%, transparent); }
.btn:active { transform: scale(0.975); }
.btn svg { width: 17px; height: 17px; flex: none; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
.btn.primary:hover { background: color-mix(in oklch, var(--accent) 88%, white); }
.btn.dark { background: var(--accent-ink); color: var(--accent); border-color: transparent; }
.btn.ghost { background: transparent; }
.btn.danger { color: var(--accent2); }
.btn.sm { min-height: 36px; padding: 0 12px; font-size: 13px; border-radius: 11px; }
.btn.icon { width: 40px; min-height: 40px; padding: 0; }
.btn.xl { min-height: 56px; font-size: 16px; border-radius: 18px; padding: 0 28px; }
.btn[disabled] { opacity: 0.45; pointer-events: none; }
label.f { display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 520; color: var(--muted-foreground); }
input[type=text], input[type=number], input[type=date], input[type=time], input[type=url], input[type=search], select, textarea { width: 100%; min-height: 44px; border-radius: 12px; border: 1px solid var(--border); background: var(--background); padding: 9px 12px; color: var(--foreground); font-size: 16px; }
textarea { min-height: 96px; resize: vertical; line-height: 1.5; }
input:focus, textarea:focus, select:focus { outline: 2px solid var(--ring); outline-offset: 0; border-color: transparent; }
input[type=checkbox] { width: 22px; height: 22px; accent-color: var(--accent); flex: none; }
.check { display: flex; align-items: center; gap: 12px; min-height: 44px; cursor: pointer; font-size: 15px; }
.fgrid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); }

/* ---------- today ---------- */
.timer { font-family: var(--mono); font-size: clamp(44px, 12vw, 64px); font-weight: 560; letter-spacing: -0.05em; line-height: 1; font-variant-numeric: tabular-nums; }
.taskline { font-size: 19px; line-height: 1.4; font-weight: 520; letter-spacing: -0.015em; text-wrap: pretty; max-width: 62ch; }
.banner { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 16px; background: color-mix(in oklch, var(--accent2) 18%, var(--card)); border: 1px solid color-mix(in oklch, var(--accent2) 40%, transparent); }
.banner svg { width: 20px; height: 20px; color: var(--accent2); flex: none; }
.session { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 9px 0; border-bottom: 1px dashed var(--border); font-size: 14px; }
.session:last-child { border: 0; }
.md { line-height: 1.6; font-size: 15px; } .md h4 { font-size: 16px; margin: 10px 0 4px; } .md code { font-family: var(--mono); background: var(--muted); padding: 1px 6px; border-radius: 6px; font-size: 13px; } .md ul { margin: 6px 0; padding-left: 22px; } .md p { margin: 6px 0; } .md pre { background: var(--muted); padding: 10px 12px; border-radius: 12px; overflow: auto; }
.status-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted-foreground); display: inline-block; flex: none; }
.st-done { background: var(--good); } .st-doing { background: var(--accent); } .st-missed { background: var(--accent2); } .st-skipped { background: transparent; border: 2px solid var(--muted-foreground); }

/* ---------- plan ---------- */
.weekgrid { display: grid; gap: 10px; grid-template-columns: 1fr; }
@media (min-width: 900px) { .weekgrid { grid-template-columns: repeat(7, 1fr); } }
.daycard { border: 1px solid var(--border); border-radius: 18px; padding: 12px; background: var(--card); display: flex; flex-direction: column; gap: 8px; min-width: 0; text-align: left; }
.daycard.today { border-color: var(--accent); }
.daycard p { font-size: 13px; line-height: 1.45; color: var(--muted-foreground); }
.month { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
.mcell { aspect-ratio: 1; min-height: 44px; border-radius: 12px; border: 1px solid var(--border); background: var(--card); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 13px; padding: 0; }
.mcell.dim { opacity: 0.35; } .mcell.today { border-color: var(--accent); } .mcell.sel { background: var(--muted); }
.mcell .status-dot { width: 7px; height: 7px; }
.mhead { text-align: center; font-size: 11px; color: var(--muted-foreground); padding: 4px 0; }
.listrow { display: grid; grid-template-columns: 34px 62px 1fr auto; gap: 10px; align-items: center; padding: 10px 4px; border-bottom: 1px solid var(--border); font-size: 14px; text-align: left; background: none; border-left: 0; border-right: 0; border-top: 0; width: 100%; min-height: 48px; }
.listrow:hover { background: color-mix(in oklch, var(--muted) 50%, transparent); }
.listrow.today { background: color-mix(in oklch, var(--accent) 10%, transparent); }
.subtabs { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; }
.subtabs button { border: 1px solid var(--border); background: none; padding: 0 16px; min-height: 40px; border-radius: 999px; color: var(--muted-foreground); font-weight: 520; white-space: nowrap; }
.subtabs button[aria-selected="true"] { background: var(--foreground); color: var(--background); border-color: transparent; }

/* ---------- quiz ---------- */
.flip { perspective: 1200px; }
.flip-in { position: relative; min-height: 240px; transition: transform 600ms var(--ease); transform-style: preserve-3d; }
.flip.on .flip-in { transform: rotateY(180deg); }
.face { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; border-radius: 22px; border: 1px solid var(--border); background: var(--card-2); padding: 24px; display: flex; flex-direction: column; justify-content: center; gap: 12px; font-size: 19px; line-height: 1.45; }
.face.back { transform: rotateY(180deg); background: color-mix(in oklch, var(--accent2) 12%, var(--card)); }
.flip.nomo .flip-in { transition: none; }
.flip.nomo .face { backface-visibility: visible; }
.flip.nomo.on .face.front, .flip.nomo:not(.on) .face.back { display: none; }
.flip.nomo .face.back { transform: none; }
.stars { display: inline-flex; gap: 4px; }
.stars button { width: 44px; height: 44px; border-radius: 12px; border: 1px solid var(--border); background: none; font-family: var(--mono); font-weight: 600; }
.stars button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
table.t { width: 100%; border-collapse: collapse; font-size: 14px; }
table.t th { text-align: left; font-weight: 520; color: var(--muted-foreground); font-size: 12px; padding: 6px 8px; }
table.t td { padding: 10px 8px; border-top: 1px solid var(--border); vertical-align: top; }

/* ---------- rewards ---------- */
.badges { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
.badge { border: 1px solid var(--border); border-radius: 18px; padding: 14px; display: flex; flex-direction: column; gap: 8px; background: var(--card); }
.badge .ico { width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center; background: color-mix(in oklch, var(--accent) 22%, transparent); color: var(--accent-fg); }
.badge .ico svg { width: 20px; height: 20px; }
.badge.locked { opacity: 0.55; filter: grayscale(0.7); }
.badge.locked .ico { background: var(--muted); color: var(--muted-foreground); }
.shop { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); }
.reward { border: 1px solid var(--border); border-radius: 18px; padding: 14px; display: flex; flex-direction: column; gap: 10px; background: var(--card); }
.chest { display: flex; align-items: center; gap: 14px; padding: 12px 14px; border-radius: 18px; border: 1px dashed color-mix(in oklch, var(--accent) 60%, transparent); background: color-mix(in oklch, var(--accent) 8%, transparent); }

/* ---------- dashboard bento grid (ported from web3-bento) ---------- */
.bento { display: grid; gap: 12px; grid-template-columns: 1fr; }
@media (min-width: 640px) { .bento { grid-template-columns: repeat(2, 1fr); } .span2 { grid-column: span 2; } }
@media (min-width: 1024px) {
  .bento { grid-template-columns: repeat(4, 1fr); }
  .b-hero { grid-column: 1 / span 2; grid-row: 1; }
  .b-cards { grid-column: 3; grid-row: 1; }
  .b-gauge { grid-column: 4; grid-row: 1; }
  .b-chart { grid-column: 1 / span 2; grid-row: 2 / span 2; }
  .b-alloc { grid-column: 3; grid-row: 2; }
  .b-today { grid-column: 4; grid-row: 2 / span 2; }
  .b-week { grid-column: 3; grid-row: 3; }
  .b-heat { grid-column: 1 / span 2; grid-row: 4; }
  .b-coins { grid-column: 3; grid-row: 4; }
  .b-proj { grid-column: 4; grid-row: 4; }
  .b-feed { grid-column: 1 / span 2; grid-row: 5; }
  .b-exams { grid-column: 3 / span 2; grid-row: 5; }
}
.strip { display: flex; align-items: flex-end; gap: 3px; min-height: 64px; flex: 1; }
.strip button { flex: 1; border: 0; padding: 0; border-radius: 4px; min-width: 0; }
.heat { display: grid; grid-auto-flow: column; grid-template-rows: repeat(7, 1fr); gap: 3px; overflow-x: auto; padding-bottom: 4px; }
.heat i, .hl i { width: 12px; height: 12px; border-radius: 3px; background: var(--muted); display: block; }
.hl { display: inline-flex; gap: 3px; }
.heat i.l1, .hl i.l1 { background: color-mix(in oklch, var(--accent) 30%, var(--muted)); } .heat i.l2, .hl i.l2 { background: color-mix(in oklch, var(--accent) 55%, var(--muted)); } .heat i.l3, .hl i.l3 { background: color-mix(in oklch, var(--accent) 80%, var(--muted)); } .heat i.l4, .hl i.l4 { background: var(--accent); }
.heat i.future { background: transparent; border: 1px dashed var(--border); }
.cardstack { position: relative; margin: -4px -20px -20px; display: flex; flex-direction: column; justify-content: flex-end; overflow: hidden; flex: 1; min-height: 232px; }
.cardstack .cs { position: absolute; left: 50%; display: block; width: calc(100% - 32px); max-width: 300px; border-radius: 12px; padding: 0; border: 0; text-align: left; box-shadow: 0 -10px 28px -14px oklch(0 0 0 / 0.75); transform-origin: top center; }
.cardstack .panel { position: relative; z-index: 10; height: 88px; display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; padding: 0 20px 16px; background: color-mix(in oklch, var(--card) 72%, transparent); backdrop-filter: blur(18px) saturate(1.3); border-top: 1px solid color-mix(in oklch, var(--foreground) 10%, transparent); }
.legend { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 14px; font-size: 12px; }
.legend li { display: flex; justify-content: space-between; gap: 8px; list-style: none; } .legend ul { margin: 0; padding: 0; }
.feed { display: flex; flex-direction: column; margin: 0 -8px; padding: 0; list-style: none; }
.feed li { display: flex; align-items: center; gap: 12px; padding: 8px; border-radius: 16px; }
.feed li:hover { background: color-mix(in oklch, var(--muted) 55%, transparent); }
.feed .ic { width: 36px; height: 36px; border-radius: 12px; background: var(--muted); display: grid; place-items: center; flex: none; } .feed .ic svg { width: 16px; height: 16px; }
.chartwrap { position: relative; flex: 1; min-height: 220px; touch-action: pan-y; }
.chartwrap svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.dot { position: absolute; width: 14px; height: 14px; border-radius: 50%; border: 3px solid var(--card); transform: translate(-50%, -50%); pointer-events: none; }

/* ---------- toasts, modal, celebration ---------- */
.toasts { position: fixed; z-index: 90; left: 12px; right: 12px; bottom: calc(86px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 8px; align-items: center; pointer-events: none; }
@media (min-width: 900px) { .toasts { bottom: 24px; left: 260px; } }
.toast { pointer-events: auto; max-width: 520px; padding: 12px 16px; border-radius: 16px; background: var(--foreground); color: var(--background); font-size: 14px; box-shadow: var(--shadow); animation: rise 380ms var(--ease); }
.toast.error { background: var(--accent2); color: oklch(0.2 0.04 300); }
@keyframes rise { from { opacity: 0; transform: translateY(10px); } }
.scrim { position: fixed; inset: 0; z-index: 80; background: oklch(0.1 0.01 290 / 0.6); display: grid; place-items: center; padding: 16px; }
.modal { background: var(--card); border: 1px solid var(--border); border-radius: 26px; padding: 24px; max-width: 420px; width: 100%; box-shadow: var(--shadow); }
.modal.wide { max-width: 560px; max-height: calc(100dvh - 32px); overflow-y: auto; overscroll-behavior: contain; }
.vsteps { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 14px; }
.vrow { display: flex; gap: 12px; align-items: flex-start; padding: 12px; border: 1px solid var(--border); border-radius: 16px; background: var(--background); }
.vrow.ok { border-color: color-mix(in oklch, var(--good) 55%, transparent); }
.vdot { flex: none; width: 22px; height: 22px; margin-top: 1px; border-radius: 50%; border: 2px solid var(--border); display: grid; place-items: center; color: var(--background); }
.vrow.ok .vdot { background: var(--good); border-color: var(--good); }
.vq { border: 0; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.vq legend { padding: 0 0 6px; }
.opt { text-align: left; min-height: 44px; padding: 9px 12px; border-radius: 12px; border: 1px solid var(--border); background: var(--card); font-size: 14px; line-height: 1.4; cursor: pointer; }
.opt:hover:not(:disabled) { border-color: var(--accent); }
.opt[aria-pressed=true] { border-color: var(--accent); background: color-mix(in oklch, var(--accent) 16%, var(--card)); }
.opt.right { border-color: var(--good); background: color-mix(in oklch, var(--good) 18%, var(--card)); }
.opt.wrong { border-color: var(--accent2); background: color-mix(in oklch, var(--accent2) 18%, var(--card)); }
.opt:disabled { cursor: default; opacity: 0.85; }
.btn.danger { background: var(--accent2); color: oklch(0.18 0.04 300); }
.modal.danger { border-color: var(--accent2); }
.celebrate { text-align: center; align-items: center; overflow: hidden; position: relative; }
.celebrate .trophy { width: 64px; height: 64px; border-radius: 20px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; animation: pop 600ms cubic-bezier(.3,1.5,.6,1); margin: 0 auto 6px; }
.celebrate .trophy svg { width: 32px; height: 32px; }
@keyframes pop { from { transform: scale(0.4); opacity: 0; } }
canvas.confetti { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 85; pointer-events: none; }
.lvlup { animation: pop 700ms cubic-bezier(.3,1.5,.6,1); }
.empty { padding: 22px 12px; text-align: center; color: var(--muted-foreground); font-size: 14px; }
.fatal { max-width: 520px; margin: 18vh auto; padding: 24px; }
details.note summary { cursor: pointer; min-height: 40px; display: flex; align-items: center; font-weight: 520; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; } }

</style>

"targetLabel":"Week 8 (Feb)","targetDay":58,"targetDate":"","examDate":"","status":"planned","cost":"Often free or low","score":"","notes":""},{"id":"secplus","name":"CompTIA Security+","targetLabel":"Fri 23 Apr","targetDay":113,"targetDate":"","examDate":"","status":"planned","cost":"about USD 400","score":"","notes":""},{"id":"ejpt","name":"INE eJPT","targetLabel":"Fri 09 Jul","targetDay":190,"targetDate":"","examDate":"","status":"planned","cost":"about USD 250","score":"","notes":""},{"id":"sc900","name":"Microsoft SC-900 (or AWS CCP)","targetLabel":"Sat 21 Aug","targetDay":233,"targetDate":"","examDate":"","status":"planned","cost":"about USD 100 (regional pricing lower)","score":"","notes":""},{"id":"cllm","name":"Red Team Leaders CLLMSP / CLLMSE","targetLabel":"Sep (week 36)","targetDay":250,"targetDate":"","examDate":"","status":"planned","cost":"Coupon price or low","score":"","notes":""},{"id":"pnpt","name":"TCM PNPT (or HTB CPTS)","targetLabel":"Oct (week 41)","targetDay":284,"targetDate":"","examDate":"","status":"planned","cost":"about USD 400","score":"","notes":""}],"milestones":[{"id":1,"done":false,"milestone":"Lab and accounts ready (GitHub, LinkedIn, TryHackMe, HTB)","target":"03 Jan","targetDay":3},{"id":2,"done":false,"milestone":"Project 3 published (Python port scanner)","target":"13 Feb","targetDay":44},{"id":3,"done":false,"milestone":"ISC2 CC passed","target":"Feb","targetDay":0},{"id":4,"done":false,"milestone":"CompTIA Security+ passed","target":"23 Apr","targetDay":113},{"id":5,"done":false,"milestone":"Project 5 published (web assessment)","target":"29 May","targetDay":149},{"id":6,"done":false,"milestone":"eJPT passed","target":"09 Jul","targetDay":190},{"id":7,"done":false,"milestone":"Project 7 published (purple-team report)","target":"24 Jul","targetDay":205},{"id":8,"done":false,"milestone":"SC-900 or AWS CCP passed","target":"21 Aug","targetDay":233},{"id":9,"done":false,"milestone":"CLLMSP and CLLMSE attempted","target":"Sep","targetDay":0},{"id":10,"done":false,"milestone":"PNPT or CPTS attempted","target":"Oct","targetDay":0},{"id":11,"done":false,"milestone":"Capstone published with demo video","target":"20 Nov","targetDay":324},{"id":12,"done":false,"milestone":"First 10 internship or job applications sent","target":"Mar for internships, Dec for jobs","targetDay":0},{"id":13,"done":false,"milestone":"40+ applications and 5+ interviews","target":"Dec","targetDay":0}],"cards":[{"week":0,"topic":"Lab setup","q":"Why take a VM snapshot before a risky lab?","a":"It lets you roll back to a known-good state in seconds if the lab breaks the machine.","source":"starter"},{"week":0,"topic":"Lab setup","q":"Which VirtualBox network mode keeps a lab VM away from your home LAN?","a":"Host-only (or Internal) network. NAT gives internet but no inbound access.","source":"starter"},{"week":1,"topic":"Networking","q":"List the OSI layers from 7 down to 1.","a":"Application, Presentation, Session, Transport, Network, Data Link, Physical.","source":"starter"},{"week":1,"topic":"Networking","q":"TCP vs UDP: what is the key difference?","a":"TCP is connection-oriented and reliable (handshake, ordering, retransmit). UDP is connectionless and faster but gives no delivery guarantee.","source":"starter"},{"week":1,"topic":"Networking","q":"What is the TCP three-way handshake?","a":"SYN, then SYN-ACK, then ACK.","source":"starter"},{"week":1,"topic":"Networking","q":"How many usable host addresses are in a /24 IPv4 subnet?","a":"254 (256 addresses minus the network and broadcast addresses).","source":"starter"},{"week":1,"topic":"Networking","q":"What range are the well-known ports?","a":"0 to 1023.","source":"starter"},{"week":2,"topic":"Networking","q":"What does ARP do?","a":"Maps an IPv4 address to a MAC address on the local network.","source":"starter"},{"week":2,"topic":"Networking","q":"What are the four steps of DHCP?","a":"Discover, Offer, Request, Acknowledge (DORA).","source":"starter"},{"week":2,"topic":"Networking","q":"Which DNS record maps a name to an IPv4 address? To a mail server?","a":"A record for IPv4 (AAAA for IPv6). MX record for mail servers.","source":"starter"},{"week":2,"topic":"Networking","q":"What is the difference between an IDS and an IPS?","a":"An IDS detects and alerts. An IPS sits inline and can also block the traffic.","source":"starter"},{"week":2,"topic":"Networking","q":"What does NAT do?","a":"Translates private internal addresses to a public address (and back) at the network edge.","source":"starter"},{"week":3,"topic":"Linux","q":"What does permission 754 mean on a file?","a":"Owner: read+write+execute (7). Group: read+execute (5). Others: read only (4).","source":"starter"},{"week":3,"topic":"Linux","q":"Which command finds files named config.txt anywhere under /etc?","a":"find /etc -name config.txt","source":"starter"},{"week":3,"topic":"Linux","q":"What is the difference between > and >> in a shell?","a":"> overwrites the file. >> appends to it.","source":"starter"},{"week":3,"topic":"Linux","q":"What does the pipe | do?","a":"Sends the standard output of one command into the standard input of the next.","source":"starter"},{"week":4,"topic":"Linux","q":"Where does Debian/Ubuntu log SSH logins and sudo use?","a":"/var/log/auth.log","source":"starter"},{"week":4,"topic":"Linux","q":"Name three basic SSH hardening steps.","a":"Use key-based auth, disable password login and root login, limit users and allowed IPs (plus a firewall such as ufw and fail2ban).","source":"starter"},{"week":4,"topic":"Linux","q":"What does fail2ban do?","a":"Watches logs for repeated failures and temporarily bans the offending IP with firewall rules.","source":"starter"},{"week":4,"topic":"Linux","q":"Which tool shows listening sockets on a modern Linux system?","a":"ss (for example ss -tulpn). It replaces netstat.","source":"starter"},{"week":5,"topic":"Python","q":"Which Python type stores key-value pairs?","a":"dict (dictionary).","source":"starter"},{"week":5,"topic":"Python","q":"Why use a virtual environment?","a":"To isolate a project's packages and versions from the system and from other projects.","source":"starter"},{"week":5,"topic":"Python","q":"What does a try/except block do?","a":"Catches an exception so the program can handle the error instead of crashing.","source":"starter"},{"week":6,"topic":"Python","q":"Which library is the usual choice for HTTP requests in Python scripts?","a":"requests.","source":"starter"},{"week":6,"topic":"Python","q":"Which module builds command line interfaces with flags and help text?","a":"argparse.","source":"starter"},{"week":6,"topic":"Python","q":"Which module parses text with patterns, for example log lines?","a":"re (regular expressions).","source":"starter"},{"week":7,"topic":"Security basics","q":"What are the three parts of the CIA triad?","a":"Confidentiality, Integrity, Availability.","source":"starter"},{"week":7,"topic":"Security basics","q":"What is the principle of least privilege?","a":"Give users and processes only the access they need to do their job, nothing more.","source":"starter"},{"week":7,"topic":"Windows","q":"Which Windows Event ID records a successful logon?","a":"4624 (4625 is a failed logon).","source":"starter"},{"week":7,"topic":"Windows","q":"What is the Windows Registry?","a":"A hierarchical database holding configuration for the OS, hardware, users and software.","source":"starter"},{"week":8,"topic":"Cryptography","q":"Symmetric vs asymmetric encryption: how many keys?","a":"Symmetric uses one shared key (fast, for bulk data). Asymmetric uses a public/private key pair (key exchange, signatures).","source":"starter"},{"week":8,"topic":"Cryptography","q":"Hashing vs encryption: what is the difference?","a":"Hashing is one-way and fixed-length (integrity). Encryption is reversible with the key (confidentiality).","source":"starter"},{"week":8,"topic":"Cryptography","q":"Why are passwords stored with a salt?","a":"A unique random salt makes identical passwords hash differently and defeats precomputed rainbow tables.","source":"starter"},{"week":8,"topic":"Cryptography","q":"Which key signs a message in a digital signature?","a":"The sender's private key. Anyone verifies it with the sender's public key.","source":"starter"},{"week":8,"topic":"Cryptography","q":"What are common AES key sizes?","a":"128, 192 and 256 bits.","source":"starter"},{"week":9,"topic":"Security+","q":"What does AAA stand for in security?","a":"Authentication, Authorization, Accounting.","source":"starter"},{"week":9,"topic":"Security+","q":"Name the four functional control types.","a":"Preventive, detective, corrective and deterrent (compensating and directive are also used).","source":"starter"},{"week":9,"topic":"Security+","q":"What is the core idea of Zero Trust?","a":"Never trust, always verify: authenticate and authorize every request, regardless of network location.","source":"starter"},{"week":9,"topic":"Security+","q":"What is non-repudiation?","a":"Proof that someone performed an action so they cannot credibly deny it (for example digital signatures and logs).","source":"starter"},{"week":10,"topic":"Security+","q":"What is the difference between phishing and spear phishing?","a":"Phishing is mass deceptive messaging. Spear phishing targets a specific person or group with tailored details.","source":"starter"},{"week":10,"topic":"Security+","q":"What is a zero-day vulnerability?","a":"A flaw unknown to the vendor, with no patch available yet.","source":"starter"},{"week":10,"topic":"Security+","q":"What does CVSS score?","a":"The severity of a vulnerability on a 0.0 to 10.0 scale.","source":"starter"},{"week":10,"topic":"Security+","q":"What is a DDoS attack?","a":"Many systems flood a target so legitimate users cannot reach it (an attack on availability).","source":"starter"},{"week":11,"topic":"Security+","q":"What is a DMZ?","a":"A network segment between the internet and the internal network that hosts public-facing services.","source":"starter"},{"week":11,"topic":"Security+","q":"What is defense in depth?","a":"Layering several independent controls so one failure does not expose everything.","source":"starter"},{"week":11,"topic":"Security+","q":"In the cloud shared responsibility model, who secures the customer's data?","a":"The customer. The provider secures the underlying infrastructure.","source":"starter"},{"week":11,"topic":"Security+","q":"Why use network segmentation or VLANs?","a":"To limit lateral movement and contain the blast radius of a compromise.","source":"starter"},{"week":12,"topic":"Security+","q":"What does a SIEM do?","a":"Collects and correlates logs from many sources to detect and alert on security events.","source":"starter"},{"week":12,"topic":"Security+","q":"Name the three classic authentication factors.","a":"Something you know, something you have, something you are.","source":"starter"},{"week":12,"topic":"Security+","q":"Credentialed vs non-credentialed vulnerability scan?","a":"Credentialed logs in and sees more detail with fewer false positives. Non-credentialed sees only what an outsider sees.","source":"starter"},{"week":13,"topic":"Incident response","q":"List the NIST incident response phases.","a":"Preparation; Detection and Analysis; Containment, Eradication and Recovery; Post-Incident Activity.","source":"starter"},{"week":13,"topic":"Incident response","q":"What is chain of custody?","a":"Documented record of who handled evidence and when, to keep it admissible and trustworthy.","source":"starter"},{"week":13,"topic":"Incident response","q":"Which evidence is collected first: RAM or disk?","a":"RAM first. It is more volatile (order of volatility).","source":"starter"},{"week":14,"topic":"Risk","q":"How is annualized loss expectancy (ALE) calculated?","a":"ALE = SLE (single loss expectancy) x ARO (annualized rate of occurrence).","source":"starter"},{"week":14,"topic":"Risk","q":"Name the four common risk responses.","a":"Mitigate, transfer, accept, avoid.","source":"starter"},{"week":14,"topic":"Risk","q":"What does RTO mean? RPO?","a":"RTO: the maximum acceptable time to restore service. RPO: the maximum acceptable amount of data loss measured in time.","source":"starter"},{"week":15,"topic":"Exam skills","q":"What is a performance-based question (PBQ)?","a":"A hands-on simulation task on the exam (for example configure a firewall rule) instead of multiple choice.","source":"starter"},{"week":15,"topic":"Exam skills","q":"Good tactic for a PBQ on a timed exam?","a":"Skip it first, answer the multiple choice, then return with the time that is left.","source":"starter"},{"week":16,"topic":"Exam skills","q":"What should you check the day before a proctored exam?","a":"ID, exam logistics and appointment time, system and room requirements, then rest.","source":"starter"},{"week":17,"topic":"Pentest","q":"List the classic pentest phases.","a":"Reconnaissance, scanning and enumeration, gaining access, maintaining access, covering tracks (plus reporting).","source":"starter"},{"week":17,"topic":"Pentest","q":"Passive vs active reconnaissance?","a":"Passive collects public information without touching the target (WHOIS, search engines). Active interacts with the target (port scans).","source":"starter"},{"week":17,"topic":"Pentest","q":"What is OSINT?","a":"Open-source intelligence: information gathered from publicly available sources.","source":"starter"},{"week":17,"topic":"Pentest","q":"What must exist before any pentest starts?","a":"Written authorization with a defined scope and rules of engagement.","source":"starter"},{"week":18,"topic":"Scanning","q":"Which nmap flag runs a TCP SYN (half-open) scan?","a":"-sS","source":"starter"},{"week":18,"topic":"Scanning","q":"Which nmap flags detect service versions and run default scripts?","a":"-sV for versions, -sC for default scripts (-A also adds OS detection and traceroute).","source":"starter"},{"week":18,"topic":"Scanning","q":"How many ports does nmap scan by default?","a":"The 1000 most common TCP ports. Use -p- for all 65535.","source":"starter"},{"week":18,"topic":"Scanning","q":"What does nmap -sn do?","a":"A ping sweep for host discovery without a port scan.","source":"starter"},{"week":19,"topic":"Web security","q":"What does the payload ' OR 1=1-- test for?","a":"SQL injection: it tries to make a WHERE condition always true and comment out the rest of the query.","source":"starter"},{"week":19,"topic":"Web security","q":"What is the primary defense against SQL injection?","a":"Parameterized queries (prepared statements), plus input validation and least-privilege DB accounts.","source":"starter"},{"week":19,"topic":"Web security","q":"Which tool automates SQL injection testing?","a":"sqlmap.","source":"starter"},{"week":20,"topic":"Web security","q":"Name the three types of XSS.","a":"Reflected, stored (persistent) and DOM-based.","source":"starter"},{"week":20,"topic":"Web security","q":"How does a CSRF token help?","a":"The server requires a secret per-session value that an attacker's forged request cannot supply.","source":"starter"},{"week":20,"topic":"Web security","q":"What does a Content Security Policy (CSP) do?","a":"Restricts which sources scripts and other resources may load from, reducing XSS impact.","source":"starter"},{"week":20,"topic":"Web security","q":"What does the HttpOnly cookie flag do?","a":"Prevents JavaScript from reading the cookie, limiting theft via XSS.","source":"starter"},{"week":21,"topic":"Web security","q":"What is IDOR?","a":"Insecure direct object reference: changing an ID in a request returns another user's data because access is not checked.","source":"starter"},{"week":21,"topic":"Web security","q":"What is SSRF?","a":"Server-side request forgery: tricking a server into making requests to internal or attacker-chosen resources.","source":"starter"},{"week":21,"topic":"Web security","q":"What is BOLA in API security?","a":"Broken object level authorization: the API does not verify the caller may access the requested object (API version of IDOR).","source":"starter"},{"week":22,"topic":"Exploitation","q":"Reverse shell vs bind shell?","a":"Reverse: the target connects out to the attacker. Bind: the target opens a port and the attacker connects in.","source":"starter"},{"week":22,"topic":"Exploitation","q":"Brute force vs password spraying?","a":"Brute force tries many passwords on one account. Spraying tries a few common passwords across many accounts to avoid lockouts.","source":"starter"},{"week":22,"topic":"Exploitation","q":"Name two offline password cracking tools.","a":"hashcat and John the Ripper.","source":"starter"},{"week":23,"topic":"Privilege escalation","q":"Command to list files with the SUID bit on Linux?","a":"find / -perm -4000 2>/dev/null","source":"starter"},{"week":23,"topic":"Privilege escalation","q":"Which command shows what the current user may run with sudo?","a":"sudo -l","source":"starter"},{"week":23,"topic":"Privilege escalation","q":"What is GTFOBins?","a":"A list of Unix binaries that can be abused for privilege escalation, file access or shells when misconfigured.","source":"starter"},{"week":24,"topic":"Privilege escalation","q":"What is an unquoted service path vulnerability?","a":"A Windows service path with spaces and no quotes lets an attacker place an executable earlier in the path that the service then runs.","source":"starter"},{"week":24,"topic":"Privilege escalation","q":"Which command shows the current token privileges on Windows?","a":"whoami /priv","source":"starter"},{"week":24,"topic":"Privilege escalation","q":"Name an enumeration script for Windows privilege escalation.","a":"WinPEAS (or PowerUp, Seatbelt).","source":"starter"},{"week":25,"topic":"Active Directory","q":"What is Kerberoasting?","a":"Requesting service tickets for accounts with SPNs and cracking them offline to recover the service account password.","source":"starter"},{"week":25,"topic":"Active Directory","q":"What is a pass-the-hash attack?","a":"Authenticating with a captured NTLM hash instead of the plaintext password.","source":"starter"},{"week":25,"topic":"Active Directory","q":"Which tool maps attack paths in an AD environment?","a":"BloodHound.","source":"starter"},{"week":25,"topic":"Active Directory","q":"Which Kerberos ticket proves identity first: TGT or TGS?","a":"The TGT (ticket-granting ticket). It is then used to request service tickets (TGS).","source":"starter"},{"week":26,"topic":"Active Directory","q":"What does a DCSync attack do?","a":"Abuses replication rights to ask a domain controller for password hashes of accounts.","source":"starter"},{"week":26,"topic":"Pivoting","q":"Which ssh flag creates a local port forward?","a":"-L (local forward). -D creates a dynamic SOCKS proxy.","source":"starter"},{"week":26,"topic":"Pivoting","q":"What does proxychains do?","a":"Routes the traffic of a tool through one or more proxies, such as a SOCKS tunnel.","source":"starter"},{"week":26,"topic":"Active Directory","q":"What is needed to forge a Golden Ticket?","a":"The hash of the krbtgt account and the domain SID.","source":"starter"},{"week":27,"topic":"eJPT","q":"Which phase comes right after host discovery in a typical engagement?","a":"Port scanning and service enumeration.","source":"starter"},{"week":27,"topic":"eJPT","q":"Why keep detailed notes during a practical exam?","a":"You must reproduce findings and answer questions later. Notes of every command and result save time.","source":"starter"},{"week":28,"topic":"Blue team","q":"Which Sysmon event ID records process creation?","a":"Event ID 1.","source":"starter"},{"week":28,"topic":"Blue team","q":"Which Windows Event ID records process creation in the Security log?","a":"4688 (when process auditing is enabled).","source":"starter"},{"week":28,"topic":"Blue team","q":"What is log correlation?","a":"Linking events from different sources into a single story or alert, for example failed logins followed by a success.","source":"starter"},{"week":29,"topic":"Detection","q":"What is a Sigma rule?","a":"A generic, vendor-neutral format for describing log detections that can be converted to SIEM queries.","source":"starter"},{"week":29,"topic":"Detection","q":"MITRE ATT&CK: tactic vs technique?","a":"A tactic is the goal (for example Persistence). A technique is how the goal is achieved (for example Scheduled Task).","source":"starter"},{"week":29,"topic":"Detection","q":"What is a false positive? A false negative?","a":"False positive: an alert with no real threat. False negative: a real threat that raised no alert.","source":"starter"},{"week":30,"topic":"DFIR","q":"Why hash a disk image before analysis?","a":"To prove the evidence was not altered, by comparing hash values before and after.","source":"starter"},{"week":30,"topic":"DFIR","q":"Static vs dynamic malware analysis?","a":"Static examines the file without running it. Dynamic runs it in an isolated sandbox and observes behavior.","source":"starter"},{"week":30,"topic":"DFIR","q":"What is an IOC?","a":"Indicator of compromise: an artifact such as a hash, IP, domain or file path that signals an intrusion.","source":"starter"},{"week":30,"topic":"DFIR","q":"Which framework analyzes memory dumps?","a":"Volatility.","source":"starter"},{"week":31,"topic":"Cloud","q":"What is the principle behind IAM roles in AWS and Azure?","a":"Grant temporary, least-privilege permissions to identities instead of sharing long-lived credentials.","source":"starter"},{"week":31,"topic":"Cloud","q":"What was Azure Active Directory renamed to?","a":"Microsoft Entra ID.","source":"starter"},{"week":31,"topic":"Cloud","q":"Why is a public S3 bucket risky?","a":"Anyone on the internet may read (or write) its objects if the policy allows it, leaking data.","source":"starter"},{"week":32,"topic":"Cloud","q":"Name a tool that audits AWS accounts for misconfigurations.","a":"Prowler (or ScoutSuite).","source":"starter"},{"week":32,"topic":"Cloud","q":"Which AWS service records API activity for auditing?","a":"CloudTrail.","source":"starter"},{"week":32,"topic":"Cloud","q":"What are CIS Benchmarks?","a":"Community consensus configuration baselines for hardening systems and cloud accounts.","source":"starter"},{"week":33,"topic":"SC-900","q":"What does Conditional Access do?","a":"Applies access decisions based on signals such as user, device, location and risk before allowing sign-in.","source":"starter"},{"week":33,"topic":"SC-900","q":"What is the Zero Trust principle 'assume breach'?","a":"Design controls as if an attacker is already inside: segment, limit access and monitor everything.","source":"starter"},{"week":33,"topic":"SC-900","q":"What is Microsoft Defender used for?","a":"A family of products for threat protection across endpoints, identities, email and cloud.","source":"starter"},{"week":34,"topic":"AI security","q":"What is prompt injection?","a":"Crafting input that makes an LLM ignore its instructions and follow the attacker's instructions instead.","source":"starter"},{"week":34,"topic":"AI security","q":"Direct vs indirect prompt injection?","a":"Direct: the user types the malicious prompt. Indirect: it hides in content the model reads, such as a web page or document.","source":"starter"},{"week":34,"topic":"AI security","q":"What does the OWASP Top 10 for LLM Applications list?","a":"The most critical risks in LLM apps, such as prompt injection, insecure output handling, training data poisoning and excessive agency.","source":"starter"},{"week":35,"topic":"AI security","q":"What is excessive agency in an LLM agent?","a":"The model has more tools, permissions or autonomy than needed, so a bad output can cause real damage.","source":"starter"},{"week":35,"topic":"AI security","q":"How can a RAG system be attacked?","a":"Poison the documents it retrieves so injected instructions or false facts reach the model.","source":"starter"},{"week":35,"topic":"AI security","q":"Name two defenses for LLM applications.","a":"Validate and sanitize model output, give tools least privilege, add guardrails and human approval for risky actions.","source":"starter"},{"week":36,"topic":"AI security","q":"What is the goal of LLM red teaming?","a":"Systematically probe a model or app for harmful, leaking or exploitable behavior before attackers do.","source":"starter"},{"week":37,"topic":"PNPT prep","q":"What kinds of work does the PNPT practical exam cover?","a":"An external and internal network pentest with Active Directory, a written report and a live debrief.","source":"starter"},{"week":37,"topic":"Reporting","q":"Why is the report as important as the hack?","a":"The client pays for clear findings, impact and fixes. Evidence you cannot explain has little value.","source":"starter"},{"week":38,"topic":"Active Directory","q":"What does Responder exploit?","a":"LLMNR/NBT-NS name resolution fallback: it answers broadcast queries to capture hashes.","source":"starter"},{"week":38,"topic":"Active Directory","q":"How does SMB signing help?","a":"It prevents relay attacks by requiring packets to be signed, so a relayed authentication fails.","source":"starter"},{"week":39,"topic":"Reporting","q":"List the main sections of a pentest report.","a":"Executive summary, scope and methodology, findings with severity and evidence, remediation advice, appendices.","source":"starter"},{"week":39,"topic":"Reporting","q":"Name the CVSS base metric groups.","a":"Attack vector, attack complexity, privileges required, user interaction, scope, and the confidentiality/integrity/availability impacts.","source":"starter"},{"week":40,"topic":"Exam skills","q":"Why do a timed mock exam week?","a":"To practice time management, note taking and reporting under real pressure.","source":"starter"},{"week":41,"topic":"Exam skills","q":"What evidence should you capture for every finding?","a":"Screenshots, commands and output, affected host and the steps to reproduce.","source":"starter"},{"week":4 /* ---------------------------------------------------------------------
   2. Small helpers
   --------------------------------------------------------------------- */
const pad = (n) => String(n).padStart(2, '0');
const ymd = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parseYmd = (s) => { const [a, b, c] = s.split('-').map(Number); return new Date(a, b - 1, c, 12); };
const addDays = (s, n) => { const d = parseYmd(s); d.setDate(d.getDate() + n); return ymd(d); };
const diffDays = (a, b) => Math.round((parseYmd(a) - parseYmd(b)) / 864e5);   // a - b
const dowOf = (s) => parseYmd(s).getDay();                                     // 0 = Sunday
/* "today": a ?today=YYYY-MM-DD URL parameter overrides it (testing aid only) */
const TODAY_OVERRIDE = (() => { try { const v = new URLSearchParams(location.search).get('today'); return /^\d{4}-\d{2}-\d{2}$/.test(v || '') ? v : null; } catch (e) { return null; } })();
const today = () => TODAY_OVERRIDE || ymd(new Date());
const nowMs = () => Date.now();
const startOfWeek = (s, startDow) => addDays(s, -((dowOf(s) - startDow + 7) % 7));
const mondayOf = (s) => startOfWeek(s, 1);
const MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
const DOWS = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
const fmtDate = (s) => { const d = parseYmd(s); return `${DOWS[d.getDay()]} ${pad(d.getDate())} ${MONTHS[d.getMonth()]}`; };
const fmtLong = (s) => { const d = parseYmd(s); return `${DOWS[d.getDay()]} ${d.getDate()} ${MONTHS[d.getMonth()]} ${d.getFullYear()}`; };
const fmtMin = (m) => (m >= 60 ? `${Math.floor(m / 60)}h ${pad(Math.round(m % 60))}m` : `${Math.round(m)}m`);
const fmtClock = (ms) => { const t = Math.max(0, Math.floor(ms / 1000)); return `${pad(Math.floor(t / 3600))}:${pad(Math.floor((t % 3600) / 60))}:${pad(t % 60)}`; };
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

/* ---------------------------------------------------------------------
   3. IndexedDB layer  (every call is wrapped; failures reach the toast)
   --------------------------------------------------------------------- */
const STORES = {
  kv: { keyPath: 'k' }, days: { keyPath: 'date' }, sessions: { keyPath: 'id' }, ledger: { keyPath: 'key' },
  cards: { keyPath: 'id' }, reviews: { keyPath: 'id' }, quizSessions: { keyPath: 'id' }, checkins: { keyPath: 'date' },
  practice: { keyPath: 'id' }, projects: { keyPath: 'num' }, certs: { keyPath: 'id' }, milestones: { keyPath: 'id' },
  rewards: { keyPath: 'id' }, redemptions: { keyPath: 'id' }, stakes: { keyPath: 'weekKey' }, badges: { keyPath: 'id' },
};
const DB = {
  db: null,
  open() {
    return new Promise((res, rej) => {
      if (!window.indexedDB) return rej(new Error('IndexedDB is not available in this browser.'));
      const r = indexedDB.open('study-tracker', 1);
      r.onupgradeneeded = () => { for (const [n, o] of Object.entries(STORES)) if (!r.result.objectStoreNames.contains(n)) r.result.createObjectStore(n, o); };
      r.onsuccess = () => { DB.db = r.result; res(); };
      r.onerror = () => rej(r.error || new Error('Could not open the database.'));
      r.onblocked = () => rej(new Error('Database is blocked by another tab. Close other tabs of this app.'));
    });
  },
  _req(store, mode, fn) {
    return new Promise((res, rej) => {
      try {
        const tx = DB.db.transaction(store, mode);
        const out = fn(tx.objectStore(store));
        tx.oncomplete = () => res(out && out.result !== undefined ? out.result : undefined);
        tx.onerror = () => rej(tx.error); tx.onabort = () => rej(tx.error || new Error('Transaction aborted'));
      } catch (e) { rej(e); }
    });
  },
  getAll: (s) => DB._req(s, 'readonly', (o) => o.getAll()),
  put: (s, v) => DB._req(s, 'readwrite', (o) => o.put(v)),
  del: (s, k) => DB._req(s, 'readwrite', (o) => o.delete(k)),
  clear: (s) => DB._req(s, 'readwrite', (o) => o.clear()),
  putMany: (s, arr) => DB._req(s, 'readwrite', (o) => { arr.forEach((v) => o.put(v)); }),
};

/* ---------------------------------------------------------------------
   4. App state (in memory, mirrored to IndexedDB)
   --------------------------------------------------------------------- */
const S = {
  settings: { ...DEFAULT_SETTINGS }, kv: {}, plan: [], phases: [], days: {}, sessions: [], ledger: {},
  cards: [], reviews: [], quizSessions: [], checkins: {}, practice: [], projects: [], certs: [], milestones: [],
  rewards: [], redemptions: [], stakes: {}, badges: {}, banners: [], toasts: [], celebrate: null, verifyReq: null,
  derived: { streak: 0, longest: 0, shields: 0, events: [] }, ready: false, error: null,
};
const listeners = new Set();
let version = 0;
const subscribe = (f) => { listeners.add(f); return () => listeners.delete(f); };
const getVersion = () => version;
const commit = () => { version++; listeners.forEach((f) => f()); };

/* friendly error handling: any failed write shows a toast and keeps the app alive */
function toast(msg, kind = 'info') {
  const t = { id: uid(), msg, kind };
  S.toasts = [...S.toasts, t].slice(-3);
  commit();
  setTimeout(() => { S.toasts = S.toasts.filter((x) => x.id !== t.id); commit(); }, kind === 'error' ? 7000 : 3500);
}
function dbFail(what) { return (e) => { console.error(what, e); toast(`Could not ${what}. Your change may not be saved (${(e && e.message) || 'storage error'}). Try Settings > Backup to export your data.`, 'error'); }; }
const save = (store, val) => DB.put(store, val).catch(dbFail('save to ' + store));
const remove = (store, key) => DB.del(store, key).catch(dbFail('delete from ' + store));
function setKv(k, v) { S.kv[k] = v; save('kv', { k, v }); }

async function loadAll() {
  const [kv, days, sessions, ledger, cards, reviews, qs, checkins, practice, projects, certs, ms, rewards, red, stakes, badges] =
    await Promise.all(['kv', 'days', 'sessions', 'ledger', 'cards', 'reviews', 'quizSessions', 'checkins', 'practice', 'projects', 'certs', 'milestones', 'rewards', 'redemptions', 'stakes', 'badges'].map(DB.getAll));
  S.kv = Object.fromEntries(kv.map((r) => [r.k, r.v]));
  S.settings = { ...DEFAULT_SETTINGS, ...(S.kv.settings || {}), times: { ...DEFAULT_SETTINGS.times, ...((S.kv.settings || {}).times || {}) } };
  S.plan = S.kv.plan || []; S.phases = S.kv.phases || [];
  S.days = Object.fromEntries(days.map((r) => [r.date, r]));
  S.sessions = sessions.sort((a, b) => a.startMs - b.startMs);
  S.ledger = Object.fromEntries(ledger.map((r) => [r.key, r]));
  S.cards = cards; S.reviews = reviews; S.quizSessions = qs.sort((a, b) => a.ts - b.ts);
  S.checkins = Object.fromEntries(checkins.map((r) => [r.date, r]));
  S.practice = practice.sort((a, b) => (a.date < b.date ? 1 : -1));
  S.projects = projects.sort((a, b) => a.num - b.num); S.certs = certs; S.milestones = ms.sort((a, b) => a.id - b.id);
  S.rewards = rewards; S.redemptions = red.sort((a, b) => b.ts - a.ts);
  S.stakes = Object.fromEntries(stakes.map((r) => [r.weekKey, r])); S.badges = Object.fromEntries(badges.map((r) => [r.id, r]));
}

/* First run: copy the seed (roadmap) into the database */
async function seedIfNeeded() {
  if (S.kv.seeded) return;
  const seed = window.SEED;
  const t = today();
  await DB.put('kv', { k: 'plan', v: seed.days }); await DB.put('kv', { k: 'phases', v: seed.phases });
  await DB.putMany('projects', seed.projects); await DB.putMany('certs', seed.certs); await DB.putMany('milestones', seed.milestones);
  await DB.putMany('cards', seed.cards.map((c, i) => ({
    id: 'c' + i, front: c.q, back: c.a, topic: c.topic, week: c.week, box: 1, due: t, reps: 0, lapses: 0, lastWrongDate: null, source: 'starter',
  })));
  await DB.putMany('rewards', CONFIG.shopDefaults.map((r, i) => ({ id: 'r' + i, name: r.name, cost: r.cost })));
  await DB.put('kv', { k: 'settings', v: { ...DEFAULT_SETTINGS } });
  await DB.put('kv', { k: 'firstOpen', v: t }); await DB.put('kv', { k: 'lastLevel', v: 0 });
  await DB.put('kv', { k: 'seeded', v: 1 });
}

/* ---------------------------------------------------------------------
   5. Plan lookup: which roadmap day is shown on which calendar date
   --------------------------------------------------------------------- */
const shiftAt = (date) => (S.kv.shifts || []).reduce((a, s) => (date >= s.from ? a + s.by : a), 0);
/* roadmap day number (1..365) for a date, or 0 when no task is planned */
const isStarted = () => !!S.settings.planStart;
function planNum(date) {
  if (!S.settings.planStart) return 0;
  const ov = S.kv.override || {};
  const n = date in ov ? ov[date] : diffDays(date, S.settings.planStart) + 1 - shiftAt(date);
  return n >= 1 && n <= S.plan.length ? n : 0;
}
const planFor = (date) => { const n = planNum(date); return n ? S.plan[n - 1] : null; };
const isRestDay = (date) => (S.kv.restDays || []).includes(date);
/* required = counts toward streak; optional = a roadmap review day (the old "Sunday review");
   rest = pre-marked rest day; none = no task */
function dayKind(date) {
  const p = planFor(date);
  if (!p) return 'none';
  if (isRestDay(date)) return 'rest';
  if (p.type === 'review') return 'optional';
  return 'required';
}
/* calendar date a roadmap day number lands on (given start date, shifts and swaps); '' if none */
function dateForDay(n) {
  if (!S.settings.planStart || !n) return '';
  const memo = S._dfd && S._dfd.v === version ? S._dfd : (S._dfd = { v: version, m: {} });
  if (n in memo.m) return memo.m[n];
  let out = '';
  for (let i = 0; i < S.plan.length + 400; i++) { const d = addDays(S.settings.planStart, i); if (planNum(d) === n) { out = d; break; } }
  return (memo.m[n] = out);
}
const certDate = (c) => c.examDate || c.targetDate || dateForDay(c.targetDay);
const rec = (date) => S.days[date] || { date };
function statusOf(date) {
  const r = rec(date).status;
  if (r) return r;
  return date < today() && dayKind(date) === 'required' ? 'missed' : 'todo';
}
const isLabLike = (type) => type === 'lab' || type === 'project';
const phaseOf = (num) => S.phases.find((p) => p.num === num);
const planEnd = () => (S.settings.planStart ? addDays(S.settings.planStart, S.plan.length - 1 + (S.kv.shifts || []).reduce((a, s) => a + s.by, 0)) : '');
/* the "current" roadmap week number (0 before the plan starts) */
function currentWeek() {
  if (!S.settings.planStart) return 0;
  const t = today();
  const p = planFor(t) || planFor(addDays(t, -1));
  if (p) return p.week;
  return t < S.settings.planStart ? 0 : 99;
}

/* ---------------------------------------------------------------------
   6. Time tracking
   --------------------------------------------------------------------- */
const minutesOn = (date) => S.sessions.filter((s) => s.date === date).reduce((a, s) => a + s.minutes, 0);
const manualOn = (date) => S.sessions.filter((s) => s.date === date && s.kind === 'manual').reduce((a, s) => a + s.minutes, 0);
const timerState = () => S.kv.timer || null;
const timerMs = (t = timerState()) => (t ? t.accMs + (t.running ? nowMs() - t.segStart : 0) : 0);

function timerStart() {
  if (timerState()) return;
  const d = new Date();
  setKv('timer', { date: today(), running: true, startedAt: nowMs(), segStart: nowMs(), accMs: 0, startHour: d.getHours() });
  const r = rec(today()); if (planFor(today()) && (!r.status || r.status === 'todo')) setDayStatus(today(), 'doing', true);
  commit();
}
function timerPause() { const t = timerState(); if (!t || !t.running) return; setKv('timer', { ...t, running: false, accMs: t.accMs + nowMs() - t.segStart }); commit(); }
function timerResume() { const t = timerState(); if (!t || t.running) return; setKv('timer', { ...t, running: true, segStart: nowMs() }); commit(); }

  const minutes = Math.max(1, Math.round(ms / 60000));
  const s = { id: uid(), date: t.date, startMs: t.startedAt, endMs: nowMs(), minutes, kind: 'timer', startHour: t.startHour };

function addManual(date, minutes, note) {

  if ((note || '').trim().length < CONFIG.verify.manualNoteMin) return toast(`Say what you studied (at least ${CONFIG.verify.manualNoteMin} characters). Manual time is only counted with a description.`, 'error');
  const left = CONFIG.manualMinutesCapPerDay - manualOn(date);

  const add = Math.min(minutes, left);

}
function deleteSession(id) {

  S.sessions = S.sessions.filter((x) => x.id !== id); remove('sessions', id); refresh([s.date]);
}

/* ---------------------------------------------------------------------
   7. Ledger: XP + coins.  Entries have unique keys so awards are idempotent.
   --------------------------------------------------------------------- */
function award(key, o) {
  const ex = S.ledger[key];
  const xp = o.xp || 0;
  const coins = o.coins !== undefined ? o.coins : Math.floor(xp * CONFIG.coinsPerXp);
  if (ex && ex.xp === xp && ex.coins === coins) return false;
  const e = { key, date: o.date || today(), ts: ex ? ex.ts : nowMs(), kind: o.kind, label: o.label, xp, coins, meta: o.meta || {} };
  S.ledger[key] = e; save('ledger', e);

}

function totals() { let xp = 0, coins = 0; for (const e of Object.values(S.ledger)) { xp += e.xp || 0; coins += e.coins || 0; } return { xp, coins: Math.max(0, coins) }; }
const balanceAsOf = (date) => Math.max(0, Object.values(S.ledger).reduce((a, e) => (e.date <= date ? a + (e.coins || 0) : a), 0));
function levelInfo(xp = totals().xp) {
  const L = CONFIG.levels; let i = 0;
  while (i + 1 < L.length && xp >= L[i + 1][1]) i++;
  const lo = L[i][1], hi = i + 1 < L.length ? L[i + 1][1] : null;
  return { idx: i, name: L[i][0], lo, hi, next: hi ? L[i + 1][0] : null, pct: hi ? (xp - lo) / (hi - lo) : 1, xp };
}

/* base XP for finishing the task of a day */
function baseXp(type) { return isLabLike(type) ? CONFIG.xp.labOrProject : (type === 'review' || type === 'rest') ? CONFIG.xp.review : CONFIG.xp.task; }
/* anti-cheat: lab and project days need a logged session or a note before they pay XP */
const hasEvidence = (date) => !!rec(date).verify || S.sessions.some((s) => s.date === date && s.kind === 'timer') || !!((rec(date).notes || '').trim() || (rec(date).learned || '').trim());
/* comeback: the most recent earlier task day was missed */
function isComeback(date) {
  if (!S.settings.comeback || S.settings.loss === 'off') return false;
  for (let i = 1; i <= 14; i++) {
    const d = addDays(date, -i); const k = dayKind(d);
    if (k === 'none' || k === 'rest') continue;
    if (k === 'optional') continue;
    return statusOf(d) === 'missed';
  }

}
/* recompute every award that belongs to one date (safe to call any number of times) */
function syncDate(date) {
  const p = planFor(date), r = rec(date);
  if (p && r.status === 'done') {
    if (!isLabLike(p.type) || hasEvidence(date)) {
      const prev = S.ledger['task:' + date];
      const comeback = prev ? prev.meta.comeback : isComeback(date);
      const base = baseXp(p.type);
      award('task:' + date, { date, kind: 'task', label: `${isLabLike(p.type) ? 'Lab' : p.type === 'review' ? 'Review' : 'Task'} done: Day ${p.day}`, xp: base * (comeback ? CONFIG.comebackMultiplier : 1), meta: { comeback: !!comeback, day: p.day } });
    } else revoke('task:' + date);
  } else revoke('task:' + date);
  const m = Math.min(minutesOn(date), CONFIG.xp.minuteCapPerDay) * CONFIG.xp.perMinute;
  if (m > 0) award('min:' + date, { date, kind: 'minutes', label: `Focused study: ${fmtMin(minutesOn(date))}`, xp: m }); else revoke('min:' + date);
  const c = S.checkins[date];
  if (c && c.finished && c.focus) award('checkin:' + date, { date, kind: 'checkin', label: 'Daily check-in', xp: CONFIG.xp.checkin }); else revoke('checkin:' + date);
  const q = S.reviews.filter((x) => x.date === date).reduce((a, x) => a + (x.xp || 0), 0);
  if (q > 0) award('quiz:' + date, { date, kind: 'quiz', label: `Quiz cards: ${S.reviews.filter((x) => x.date === date).length} answered`, xp: q }); else revoke('quiz:' + date);
}

/* ---------------------------------------------------------------------
   8. Day status changes
   --------------------------------------------------------------------- */

}

   Only undoing a completion skips it, because that removes points instead of adding them. */
function completeDay(date) {

/* lowercase, no punctuation: used to spot the same proof pasted onto two days */

/* '' when the proof is acceptable, otherwise the reason it is not */
function proofProblem(text, { min, words = 0, unique = false, date } = {}) {
  const t = String(text || '').trim(), n = t.split(/\s+/).filter(Boolean).length;
  if (t.length < min) return `Write at least ${min} characters (${t.length} so far).`;
  if (words && n < words) return `Use at least ${words} words so it says something specific (${n} so far).`;
  if (/^(.)\1+$/.test(t.replace(/\s/g, ''))) return 'That looks like filler text.';
  if (unique && Object.values(S.days).some((r) => r.date !== date && r.verify && normText(r.verify.proof) === normText(t))) return 'You already used this exact proof on another day. Describe what you did today.';

}

    facts: [['Days completed', String(done)], ['Time logged', fmtMin(mins)], ['XP / coins', `${t.xp} / ${t.coins}`], ['Badges', String(Object.keys(S.badges).length)], ['Plan start date', S.settings.planStart ? fmtDate(S.settings.planStart) : 'not started']],

/* ---- verification window plumbing ---- */
function requestVerify(spec) { S.verifyReq = { ...spec, id: uid() }; commit(); }
function closeVerify() { S.verifyReq = null; commit(); }
/* multiple-choice options for a flash card: the right answer plus three other cards' answers (same topic first) */
function mcqOptions(card) {
  const others = S.cards.filter((c) => c.id !== card.id && c.back && c.back.trim() !== card.back.trim());
  const seen = new Set(), pick = [];
  /* look-alike wrong answers: same topic and similar length rank first, with some randomness */
  const rank = (c) => (c.topic === card.topic ? 0 : 40) + Math.abs(c.back.length - card.back.length) * 0.5 + Math.random() * 30;
  for (const c of others.map((c) => [rank(c), c]).sort((a, b) => a[0] - b[0]).map((x) => x[1])) {
    const k = c.back.trim().toLowerCase(); if (seen.has(k)) continue; seen.add(k); pick.push(c.back); if (pick.length === 3) break;
  }
  if (pick.length < 3) return null;
  return shuffle([{ text: card.back, ok: true }, ...pick.map((text) => ({ text, ok: false }))]);
}
/* n questions for the day's week (this week's cards first, then earlier weeks) */
function buildQuiz(week, n) {
  const eligible = S.cards.filter((c) => c.week != null && c.week <= week);
  const pool = [...shuffle(eligible.filter((c) => c.week === week)), ...shuffle(eligible.filter((c) => c.week !== week)), ...shuffle(S.cards.filter((c) => !eligible.includes(c)))];
  const out = [];
  for (const c of pool) { const opts = mcqOptions(c); if (opts) out.push({ id: c.id, q: c.front, topic: c.topic, opts }); if (out.length === n) break; }
  return out;

function skipDay(date) { const s = rec(date).status === 'skipped'; setDayStatus(date, s ? 'todo' : 'skipped', true); refresh([date]); }
/* swap the roadmap tasks of two calendar dates */
function rescheduleDay(from, to) {
  if (from === to) return;
  const ov = { ...(S.kv.override || {}) };
  const a = planNum(from), b = planNum(to);
  ov[from] = b; ov[to] = a;
  setKv('override', ov);
  for (const d of [from, to]) if (rec(d).status === 'missed' || rec(d).status === 'skipped') setDayStatus(d, 'todo', true);

  refresh([from, to]);
}

}
function toggleCustom(date, id) { patchDay(date, { custom: (rec(date).custom || []).map((c) => (c.id === id ? { ...c, done: !c.done } : c)) }); }
function removeCustom(date, id) { patchDay(date, { custom: (rec(date).custom || []).filter((c) => c.id !== id) }); }

/* rest days: at most 2 per calendar month */
function toggleRestDay(date) {

  if (list.includes(date)) { setKv('restDays', list.filter((d) => d !== date)); toast('Rest day removed.'); }
  else {
    if (date < today()) return toast('Rest days must be set ahead of time.', 'error');
    const inMonth = list.filter((d) => d.slice(0, 7) === date.slice(0, 7)).length;
    if (inMonth >= CONFIG.restDaysPerMonth) return toast(`Only ${CONFIG.restDaysPerMonth} rest days per month.`, 'error');
    setKv('restDays', [...list, date].sort()); toast(`${fmtDate(date)} is a rest day. Your streak is safe.`, 'good');
  }
  refresh([date]);
}

/* ---------------------------------------------------------------------
   9. Streak / miss / shield replay (derived from history on every open)
   --------------------------------------------------------------------- */
function replay() {
  if (!S.settings.planStart) { S.derived = { streak: 0, longest: S.kv.longestEver || 0, shields: 0, events: [] }; return; }
  const t = today(), start = S.settings.planStart, reset = S.kv.streakReset;
  let from = start; if (reset && addDays(reset, 1) > from) from = addDays(reset, 1);
  const chest = {};
  for (const e of Object.values(S.ledger)) if (e.kind === 'chest' && e.meta && e.meta.shield) chest[e.date] = (chest[e.date] || 0) + 1;
  let streak = 0, longest = 0, shields = 0; const ev = [];
  const n = diffDays(t, from);
  for (let i = 0; i <= n; i++) {
    const d = addDays(from, i);
    if (chest[d]) shields = Math.min(CONFIG.shield.max, shields + chest[d]);
    const kind = dayKind(d); if (kind === 'none' || kind === 'rest') continue;
    const st = statusOf(d);
    if (st === 'done') {
      streak++; longest = Math.max(longest, streak);
      if (streak % CONFIG.shield.every === 0 && shields < CONFIG.shield.max) { shields++; ev.push({ type: 'shield+', date: d }); }
      if (streak % 7 === 0) ev.push({ type: 'streak7', date: d, streak });
      if (streak % 30 === 0) ev.push({ type: 'streak30', date: d, streak });
      continue;
    }
    if (d >= t || kind === 'optional' || S.settings.loss === 'off') continue;
    if (shields > 0) { shields--; ev.push({ type: 'shield-used', date: d }); continue; }
    streak = 0; ev.push({ type: st === 'skipped' ? 'skip' : 'miss', date: d });
  }
  S.derived = { streak, longest: Math.max(longest, S.kv.longestEver || 0), shields, events: ev };
  if (longest > (S.kv.longestEver || 0)) setKv('longestEver', longest);
}
function reconcile() {
  const t = today(), start = S.settings.planStart;
  if (!start) { replay(); return; }
  // 1. any required day in the past that was never finished becomes "missed"
  for (let i = 0; i <= diffDays(addDays(t, -1), start); i++) {
    const d = addDays(start, i);
    if (dayKind(d) !== 'required') continue;
    const st = rec(d).status;
    if (!st || st === 'todo' || st === 'doing') setDayStatus(d, 'missed', true);
  }
  // 2. replay history for streak / shields
  replay();
  // 3. coin penalties and streak bonuses (idempotent ledger entries)
  const scale = CONFIG.lossScale[S.settings.loss] ?? 1;
  const wanted = new Set();
  for (const e of S.derived.events) {
    if (e.type === 'miss' && scale > 0) {
      const key = 'miss:' + e.date; wanted.add(key);
      if (!S.ledger[key]) {
        const pen = Math.min(Math.round(CONFIG.missedCoinPenalty * scale), balanceAsOf(e.date));
        award(key, { date: e.date, kind: 'penalty', label: `Missed day ${fmtDate(e.date)}`, xp: 0, coins: -pen, meta: { pen } });
      }
    }
    if (e.type === 'streak7') award('streak7:' + e.date, { date: e.date, kind: 'streak', label: `${e.streak}-day streak bonus`, xp: CONFIG.xp.streak7 });
    if (e.type === 'streak30') award('streak30:' + e.date, { date: e.date, kind: 'streak', label: `${e.streak}-day streak bonus`, xp: CONFIG.xp.streak30 });
  }
  // a penalty disappears again if its day was later fixed (recoverable, never shaming)
  for (const e of Object.values(S.ledger)) if (e.kind === 'penalty' && !wanted.has(e.key)) revoke(e.key);
}
function resetStreak() { setKv('streakReset', today()); toast('Streak reset. It starts fresh tomorrow.'); refresh([]); }
function setCoins(target) {
  const cur = totals().coins; const diff = Math.round(target) - cur; if (!diff) return;
  award('adjust:' + uid(), { date: today(), kind: 'adjust', label: 'Manual coin adjustment', xp: 0, coins: diff });
  toast(`Coins set to ${Math.round(target)}.`); refresh([]);
}

/* ---------------------------------------------------------------------
   10. Weeks: chest, stake, recap
   --------------------------------------------------------------------- */
const tasksDoneIn = (from, to) => { let n = 0; for (let d = from; d <= to; d = addDays(d, 1)) if (planFor(d) && rec(d).status === 'done') n++; return n; };
/* Perfect week = every non-review task of one ROADMAP week is done (the 5 study days plus the lab).
   Weeks follow the roadmap's own "Week N" grouping, so they work from any start day. */
function roadmapWeeks() {
  const m = {};
  if (!S.settings.planStart) return m;
  const n = diffDays(today(), S.settings.planStart);
  for (let i = 0; i <= n; i++) { const d = addDays(S.settings.planStart, i), p = planFor(d); if (p) (m[p.week] = m[p.week] || []).push(d); }
  return m;
}
function chestWeeks() {
  const out = [];
  for (const [w, dates] of Object.entries(roadmapWeeks())) {
    const full = S.plan.filter((p) => p.week === Number(w) && p.type !== 'review').length;
    const need = dates.filter((d) => planFor(d).type !== 'review');
    if (need.length >= full && need.length >= 3 && need.every((d) => rec(d).status === 'done') && need.some((d) => isLabLike(planFor(d).type)))
      out.push({ weekKey: 'w' + w, week: Number(w), lastDate: dates[dates.length - 1], ...(S.kv.chests || {})['w' + w] });
  }
  return out.sort((a, b) => b.week - a.week);
}
function openChest(weekKey) {
  const chests = { ...(S.kv.chests || {}) };
  if ((chests[weekKey] || {}).opened) return;
  const o = CONFIG.chest.odds, r = Math.random();
  let reward;
  const coins = () => ({ type: 'coins', amount: CONFIG.chest.coinsMin + Math.floor(Math.random() * (CONFIG.chest.coinsMax - CONFIG.chest.coinsMin + 1)) });
  if (r < o.coins) reward = coins();
  else if (r < o.coins + o.shield) reward = S.derived.shields < CONFIG.shield.max ? { type: 'shield' } : { type: 'coins', amount: CONFIG.chest.fallbackCoins };
  else reward = S.badges['lucky-chest'] ? { type: 'coins', amount: CONFIG.chest.fallbackCoins } : { type: 'badge' };
  chests[weekKey] = { opened: true, reward, ts: nowMs() }; setKv('chests', chests);
  if (reward.type === 'coins') award('chest:' + weekKey, { date: today(), kind: 'chest', label: 'Weekly chest', xp: 0, coins: reward.amount });
  else if (reward.type === 'shield') award('chest:' + weekKey, { date: today(), kind: 'chest', label: 'Weekly chest: streak shield', xp: 0, coins: 0, meta: { shield: 1 } });
  else unlockBadge('lucky-chest');
  S.celebrate = { title: 'Bonus chest opened', body: reward.type === 'coins' ? `+${reward.amount} coins` : reward.type === 'shield' ? 'A streak shield' : 'The Lucky Chest badge' };

}
/* stakes (opt-in) */
function createStake(weekKey, amount, goal) {
